<script>
const MD = "# 週間メニュー & 買い物計画\n\n1日の目標: **約1,450kcal / タンパク質 110–120g**。カロリーの調整はご飯の量で行い、タンパク源は減らさない。\n買い物は **週2回（土曜夕方・水曜）**。メニューの週は **土曜始まり**。数値はすべて概算。\n\n## 1日の型\n\n| 食事       | 内容                                             |\n| ---------- | ------------------------------------------------ |\n| 朝         | 下記 A / B / C（曜日別メニュー参照）             |\n| 昼         | メイン（肉・魚・卵）+ ご飯 + 汁物 or 副菜        |\n| 夕         | メイン + 副菜 + ご飯                             |\n| プロテイン | **1日2杯・水割り**（朝と夜。1杯 110kcal / P20g） |\n\n### 朝食パターン\n\n|                   | 内容                                                                                   | kcal | P   |\n| ----------------- | -------------------------------------------------------------------------------------- | ---- | --- |\n| A（オートミール） | [オートミール](recipes.html#オートミールの基本)30g + オイコス1個 + バナナ1/2 + ゆで卵1個 | 327  | 20  |\n| B（和定食）       | ご飯100g + 納豆 + 卵1個 + [味噌汁](recipes.html#味噌汁)（豆腐・わかめ）                  | 362  | 19  |\n| C（軽め）         | オイコス1個 + バナナ1本 + ゆで卵2個                                                    | 332  | 23  |\n\n## 曜日別メニュー\n\n※ 各食事は「内容（概算kcal / P）」。日合計にはプロテイン2杯（220kcal / P40g）を含む。\n※ 料理名は作り方ページ [recipes.md](recipes.html) へのリンク。\n※ **土曜の買い物は夕方**。土曜の朝・昼は前の周期の残り・保存品（卵・納豆・前週購入のキャベツ等）で済ませ、**土曜夕食から新しい食材を使う**。\n\n### 土（1回目の買い物日・まとめ作り日）\n\n| 食事   | 内容                                                                                                                  | kcal        | P         |\n| ------ | --------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | B（和定食）※前の周期の納豆・卵で                                                                                      | 362         | 19        |\n| 昼     | [サバ缶とキャベツの卵とじ](recipes.html#サバ缶とキャベツの卵とじ)（サバ缶1/2・卵2個・前週購入の残りキャベツ）+ ご飯100g | 426         | 31        |\n| 夕     | [鮭の塩焼き](recipes.html#鮭の塩焼き)1切れ + [ほうれん草おひたし](recipes.html#ほうれん草のおひたし) + ご飯100g + 納豆    | 382         | 30        |\n| 間食   | ゆで卵1個                                                                                                             | 75          | 6         |\n| **計** |                                                                                                                       | **約1,465** | **約126** |\n\n### 日\n\n| 食事   | 内容                                                                                                                                          | kcal        | P         |\n| ------ | --------------------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                                                       | 327         | 20        |\n| 昼     | [鶏むねネギ塩レモン焼き](recipes.html#鶏むねネギ塩レモン焼き)150g + ご飯150g + 味噌汁 + [ブロッコリーの塩ゆで](recipes.html#ブロッコリーの塩ゆで) | 487         | 43        |\n| 夕     | [鮭のホイル焼き](recipes.html#鮭のホイル焼き)（玉ねぎ・きのこ）+ ほうれん草おひたし + ご飯100g                                                  | 342         | 24        |\n| 間食   | ゆで卵1個                                                                                                                                     | 75          | 6         |\n| **計** |                                                                                                                                               | **約1,483** | **約133** |\n\n### 月\n\n| 食事   | 内容                                                                                                                               | kcal        | P         |\n| ------ | ---------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                                            | 327         | 20        |\n| 昼     | [鶏むねのカレー粉焼き](recipes.html#鶏むねのカレー粉焼き)150g + ご飯150g + [ブロッコリーの塩ゆで](recipes.html#ブロッコリーの塩ゆで)   | 460         | 39        |\n| 夕     | [豆腐ステーキ](recipes.html#豆腐ステーキ)200g + [ほうれん草のおひたし](recipes.html#ほうれん草のおひたし)（作り置き）+ ご飯100g + 納豆 | 409         | 23        |\n| 間食   | ゆで卵1個                                                                                                                          | 75          | 6         |\n| **計** |                                                                                                                                    | **約1,523** | **約128** |\n\n### 火（卓球日・ご飯多め）\n\n| 食事   | 内容                                                                                                               | kcal        | P         |\n| ------ | ------------------------------------------------------------------------------------------------------------------ | ----------- | --------- |\n| 朝     | B（和定食）                                                                                                        | 362         | 19        |\n| 昼     | [鶏むねとキャベツのタッカルビ風](recipes.html#鶏むねとキャベツのタッカルビ風)（鶏むね150g・キムチ80g）+ ご飯100g     | 421         | 42        |\n| 夕     | 鶏むね150gと野菜の[ちゃんこ風鍋](recipes.html#ちゃんこ風鍋)（キャベツ・玉ねぎ・きのこ・豆腐1/2丁・冷凍分）+ ご飯100g | 474         | 43        |\n| 間食   | バナナ1本（卓球前後に）                                                                                            | 90          | 1         |\n| **計** |                                                                                                                    | **約1,565** | **約145** |\n\n※ 火曜は卓球120分の日のため、他の曜日より約100kcal多めに設定している。\n\n### 水（2回目の買い物日）\n\n| 食事   | 内容                                                                                                                                     | kcal        | P         |\n| ------ | ---------------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n | 夕150（冷凍） |               |\n| 鮭2切れ                  | 夕            | 夕       |            |                      |          |               |               |\n| ほうれん草               | 夕            | 夕       | 夕（作置） |                      |          |               |               |\n| ブロッコリー             |               | 昼       | 昼         |                      |          |               |               |\n| ささみ300g（水購入）     |               |          |            |                      | 夕150    | 昼150         |               |\n| 小松菜（水購入）         |               |          |            |                      | 夕       | 夕            |               |\n| 豆腐（土2丁+水1丁）      |               | 汁       | 汁・夕     | 汁・夕               | 汁       | 汁            | 汁            |\n| キャベツ                 | 昼（前週分）  |          |            | 昼・夕               | 昼       | 昼            | 夕            |\n| 玉ねぎ・きのこ・にんじん |               | 夕       |            | 昼・夕               | 昼       | 昼            | 夕            |\n| サバ缶2缶                | 昼半分        |          |            |                      | 昼半分   |               | 夕半分        |\n| 卵（土10個 + 水10個）    | 朝1・昼2・間1 | 朝1・間1 | 朝1・間1   | 朝1                  | 朝1・間1 | 朝1・間1      | 朝2・昼1・間1 |\n\n## 調理のコツ\n\n- **鶏むねは購入日（土曜）に150g×5に分ける**。火夕（鍋）・木夕（カレー粉焼き）の2つは[下味冷凍](recipes.html#鶏むねの下味冷凍)\n- **土曜の買い物後に[まとめ作り](recipes.html#週初のまとめ作り30分)**: ゆで卵5個・ほうれん草のおひたし。水曜の買い物後にゆで卵を追加し、[にんじんをレンチン](recipes.html#にんじんのレンチンアイラップ)しておくと後半が楽\n- **鶏むね・ささみは片栗粉をまぶしてから焼く**とパサつかない\n- 味付けの油は1日小さじ1–2（約40–80kcal）まで\n\n## コンビニでタンパク質を確保する（外出・遠征・時間がない日）\n\n**選ぶ基準は「タンパク質1gあたりのkcal」**。この数字が小さいほど、減量中には有利。\n\n| 商品                                | kcal | P   | kcal/P1g | 評価             |\n| ----------------------------------- | ---- | --- | -------- | ---------------- |\n| サラダチキン（プレーン）            | 110  | 23g | **4.8**  | ◎ 最良           |\n| プロテイン粉（持参・水割り1杯）     | 110  | 20g | **5.5**  | ◎                |\n| ザバス ミルクプロテイン 脂肪0 200ml | 100  | 15g | **6.7**  | ○ 手軽さでは一番 |\n| オイコス（フレーバー付き110g）      | 92   | 10g | 9.2      | ○                |\n| ゆで卵1個                           | 75   | 6g  | 12.5     | △ 補助的に       |\n| 1本満足バー プロテイン              | 190  | 15g | 12.7     | △                |\n| inバー プロテイン ベイクドチョコ    | 213  | 10g | **21.3** | ✗ 実質チョコ菓子 |\n\n- **プロテインバーは避ける。** 生地やチョコの分でカロリーが膨らみ、効率が粉の2〜4倍悪い\n- **ドリンクタイプ（ザバス等）が現実的な代替。** 冷蔵で売られていて、その場で飲める\n- **サラダチキンが最強**だが、食事として食べるものなので間食には向かない場面もある\n";

// 見出しにGitHub風のアンカーidを付与する（日本語は保持、空白はハイフン、記号は除去）。
// menu.html からの recipes.html#料理名 のようなアンカーリンクを機能させるため。
(function () {
  const seen = new Set();
  document.querySelectorAll('.md h1,.md h2,.md h3,.md h4,.md h5,.md h6').forEach(function (h) {
    const base = h.textContent
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[!-/:-@[-\`{-~、。・（）［］「」『』：；？！　]/g, '');
    let id = base;
    let n = 1;
    while (document.getElementById(id) || seen.has(id)) {
      id = base + '-' + n;
      n += 1;
    }
    seen.add(id);
    h.id = id;
  });
})();

// 横に長い表はスマホで独立してスクロールさせる
document.querySelectorAll('.md table').forEach(function (t) {
  const box = document.createElement('div');
  box.className = 'table-scroll';
  box.tabIndex = 0;
  box.setAttribute('role', 'region');
  box.setAttribute('aria-label', '表（横にスクロールできます）');
  t.parentNode.insertBefore(box, t);
  box.appendChild(t);
});

// 既存の見出しIDを利用し、献立からのリンク先を保ったまま目次を作る。
const tocPanel = document.querySelector('.toc-panel');
function isCompact() { return window.matchMedia && window.matchMedia('(max-width: 760px)').matches; }
if (isCompact()) tocPanel.removeAttribute('open');
const headings = Array.from(document.querySelectorAll('.md h2,.md h3'));
const toc = document.getElementById('page-toc');
const status = document.getElementById('toc-status');
const items = headings.map(function (heading) {
  const li = document.createElement('li');
  if (heading.tagName === 'H3') li.className = 'toc-sub';
  const a = document.createElement('a');
  a.href = '#' + encodeURIComponent(heading.id);
  a.textContent = heading.textContent;
  a.addEventListener('click', function () {
    if (isCompact()) tocPanel.removeAttribute('open');
  });
  li.appendChild(a);
  toc.appendChild(li);
  return { li: li, link: a, heading: heading };
});
function normalizeSearch(value) { return value.normalize('NFKC').toLowerCase().trim(); }
document.getElementById('toc-search').addEventListener('input', function (event) {
  const query = normalizeSearch(event.target.value);
  let count = 0;
  items.forEach(function (item) {
    item.li.hidden = !normalizeSearch(item.heading.textContent).includes(query);
    if (!item.li.hidden) count += 1;
  });
  status.textContent = query ? (count ? count + '件の見出し' : '該当する見出しがありません') : '';
});
function markCurrent(id) {
  items.forEach(function (item) {
    if (item.heading.id === id) item.link.setAttribute('aria-current', 'location');
    else item.link.removeAttribute('aria-current');
  });
}
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(function (entries) {
    const visible = entries.filter(function (entry) { return entry.isIntersecting; });
    if (visible.length) markCurrent(visible[0].target.id);
  }, { rootMargin: '0px 0px -65% 0px' });
  headings.forEach(function (heading) { observer.observe(heading); });
}
function followHash() {
  let id;
  try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
  const target = document.getElementById(id);
  if (target) { target.scrollIntoView(); markCurrent(id); }
}
window.addEventListener('hashchange', followHash);
if (location.hash) requestAnimationFrame(followHash);

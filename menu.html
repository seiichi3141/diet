<script>
const MD = "# 週間メニュー & 買い物計画\n\n1日の目標: **約1,450kcal / タンパク質 110g 以上（120g前後）**（2026-08-16 改定。経緯は plan.md の「見直し履歴」参照）\n**カロリーを下げた分はご飯（炭水化物）で調整し、タンパク源は減らさない。**\n買い物は **週2回（土曜・水曜）** で済み、食材を使い切る設計。メニューの週は **土曜始まり**。\n数値はすべて概算。お腹の空き具合・体重の落ちペースに応じて **ご飯の量（±50–100g）で調整** する。\n\n## 1日の型\n\n| 食事       | 内容                                                                                                                                           |\n| ---------- | ---------------------------------------------------------------------------------------------------------------------------------------------- |\n| 朝         | 下記 A / B / C のローテーション                                                                                                                |\n| 昼         | メイン（肉・魚・卵）+ ご飯 + 汁物 or 副菜                                                                                                      |\n| 夕         | メイン + 副菜 + ご飯                                                                                                                           |\n| プロテイン | **1日2杯・水割り**（朝・運動後など。1杯 = 110kcal / P20g）。牛乳250mlで割ると1杯281kcal・P28gになり、2杯で1日342kcal超過するため水を基本とする |\n\n### 朝食パターン（固定化して迷わない）\n\n|                   | 内容                                                                                   | kcal  | P     |\n| ----------------- | -------------------------------------------------------------------------------------- | ----- | ----- |\n| A（オートミール） | [オートミール](recipes.html#オートミールの基本)30g + オイコス1個 + バナナ1/2 + ゆで卵1個 | 約327 | 約20g |\n| B（和定食）       | ご飯150g + 納豆 + 卵1個 + [味噌汁](recipes.html#味噌汁)（豆腐・わかめ）                  | 約440 | 約20g |\n| C（軽め）         | オイコス1個 + バナナ1本 + ゆで卵2個                                                    | 約332 | 約23g |\n\n## 買い物リスト\n\n### 土曜（1回目の買い物・まとめ買い）\n\n| 食材                           | 量        | 使うメニュー                                                           |\n| ------------------------------ | --------- | ---------------------------------------------------------------------- |\n| 鶏むね肉（皮なし）             | 600g      | 日昼・月昼・火夕・木夕（150g×4に分け、購入日に下味をつけて半分は冷凍） |\n| 鮭の切り身                     | 2切れ     | 土夕・日夕（**買ってすぐ消費**）                                       |\n| 卵                             | 10個      | 朝食・土昼オムレツ・間食                                               |\n| 木綿豆腐                       | 2丁       | 月夕・火夕・味噌汁                                                     |\n| 納豆                           | 3パック×2 | 朝B・夕食の付け合わせ                                                  |\n| オイコス（フレーバー付き）     | 110g×4個  | 朝A（日月水）・朝C（金）。**間食では食べない**                         |\n| バナナ                         | 1房       | 朝A/C・間食                                                            |\n| ほうれん草                     | 1袋       | 土夕・日夕・月夕（おひたし作り置き。**前半に消費**）                   |\n| ブロッコリー                   | 1株       | 日昼・月昼・火昼（塩ゆで。**前半に消費**）                             |\n| キャベツ                       | 1/2玉     | 土昼・水昼・火夕・金夕（長持ち）                                       |\n| 玉ねぎ                         | 3個       | 日夕・火夕・金夕（長持ち）                                             |\n| きのこ（しめじ等）             | 2パック   | 日夕・火夕・金夕                                                       |\n| にんじん                       | 2本       | 水昼（きんぴら）・金夕（スープ）（長持ち）                             |\n| サバ水煮缶                     | 2缶       | 水昼・金夕（保存食・後半用）                                           |\n| 長ねぎ                         | 1本       | 日昼（ネギ塩レモン）・月昼（よだれ鶏の薬味）                           |\n| レモン                         | 1個       | 日昼（ネギ塩レモン）                                                   |\n| 梅干し                         | 小1パック | 水夕（ささみの梅しそ和え）                                             |\n| （ストック品）米・オートミール | 切れたら  | 全期間                                                                 |\n\n### 調味料（常備ストック。初回にまとめて確認・なければ購入）\n\n**この週のレシピで実際に使うもの**: 醤油 / みりん / 酒 / 砂糖 / 酢 / 味噌 / 塩こしょう / サラダ油 / ごま油 / 辣油 / 練りごま / すりごま / 片栗粉 / コンソメ / 鶏がらスープの素 / 生姜チューブ / にんにくチューブ\n\n**あると便利（任意）**: 塩こうじ（鶏むねの下味用）/ ポン酢（ホイル焼き）/ 鰹節（おひたし）/ 胡麻ドレッシング or オリーブ油（サラダ用）\n\n※ うち **木〜土曜のつなぎ期間だけ**で必要なのは: 醤油・みりん・酒・砂糖・酢・味噌・練りごま・コンソメ・鶏がらスープの素・油・塩こしょう（+ あれば生姜チューブ）\n\n### 水曜（2回目の買い物・補充）\n\n| 食材                 | 量                | 使うメニュー                     |\n| -------------------- | ----------------- | -------------------------------- |\n| ささみ               | 300g              | 水夕・木昼                       |\n| 小松菜 or ほうれん草 | 1袋               | 水夕（炒め）・木夕（おひたし）   |\n| 大葉                 | 1パック           | 水夕（ささみの梅しそ和え）       |\n| 木綿豆腐             | 1丁               | 後半の味噌汁                     |\n| 卵                   | 10個              | 週の消費は約17個。水曜に必ず補充 |\n| バナナ               | 1房（残数を見て） | 朝・間食                         |\n\n## 開始時のつなぎ買い物（2026-08-06 木曜 → 8/8 土曜夕方の買い物まで）\n\n木曜の昼・夕・金曜・土曜の朝昼をカバーする最小セット。土曜夕食から本サイクルに移行する。\n\n| 食材                       | 量           | 使うメニュー                                                              |\n| -------------------------- | ------------ | ------------------------------------------------------------------------- |\n| ささみ                     | 150g         | 木昼（棒棒鶏）                                                            |\n| 鶏むね肉（皮なし）         | 150g         | 木夕（照り焼き。※冷凍せずそのまま調理）                                   |\n| 卵                         | 10個         | 木金土の朝・金昼雑炊・土昼オムレツ（約7個使用）                           |\n| 納豆                       | 3パック      | 木朝・土朝・土昼                                                          |\n| ギリシャヨーグルト（無糖） | 400g 1個     | 金朝100g → 残り300gは日月水の朝Aに充てる（**土曜は購入不要**）            |\n| 木綿豆腐                   | 1丁          | 味噌汁（木朝・木昼・土朝）                                                |\n| サバ水煮缶                 | 1缶          | 金夕（半分使用。残りは来週へ。**土曜はサバ缶1缶でよい**）                 |\n| 小松菜 or ほうれん草       | 1袋          | 木夕（おひたし）。余りは金昼の雑炊へ                                      |\n| キャベツ                   | 1/2玉        | 金夕スープ・土昼サラダ。余りは来週へ（**土曜は購入不要**）                |\n| バナナ                     | 1房          | 木金の間食・金朝                                                          |\n| 米・オートミール           | ストック確認 | オートミールは金昼・来週の朝Aで使用。味噌・調味料は上の「調味料」節を参照 |\n\n## 曜日別メニュー\n\n※ 各食事は「内容（概算kcal / P）」。日合計にはプロテイン2杯（220kcal / P40g）を含む。\n※ 料理名は作り方ページ [recipes.md](recipes.html) へのリンク。\n※ **土曜の買い物は夕方**。土曜の朝・昼は前の周期の残り・保存品（卵・納豆・前週購入のキャベツ等）で済ませ、**土曜夕食から新しい食材を使う**。\n\n### 土（1回目の買い物日・まとめ作り日）\n\n| 食事   | 内容                                                                                                                           | kcal        | P         |\n| ------ | ------------------------------------------------------------------------------------------------------------------------------ | ----------- | --------- |\n| 朝     | B（和定食）※前の周期の納豆・卵で。ご飯100g                                                                                     | 362         | 19        |\n| 昼     | [納豆オムレツ](recipes.html#納豆オムレツ)（卵2個+納豆）+ [キャベツサラダ](recipes.html#キャベツサラダ)（前週購入の残り）+ ご飯100g | 427         | 20        |\n| 夕     | [鮭の塩焼き](recipes.html#鮭の塩焼き)1切れ + [ほうれん草おひたし](recipes.html#ほうれん草のおひたし) + ご飯100g + 納豆             | 382         | 30        |\n| 間食   | ゆで卵1個                                                                                                                      | 75          | 6         |\n| **計** |                                                                                                                                | **約1,465** | **約115** |\n\n### 日\n\n| 食事   | 内容                                                                                                                                          | kcal        | P         |\n| ------ | --------------------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                                                       | 295         | 20        |\n| 昼     | [鶏むねネギ塩レモン焼き](recipes.html#鶏むねネギ塩レモン焼き)150g + ご飯150g + 味噌汁 + [ブロッコリーの塩ゆで](recipes.html#ブロッコリーの塩ゆで) | 487         | 43        |\n| 夕     | [鮭のホイル焼き](recipes.html#鮭のホイル焼き)（玉ねぎ・きのこ）+ ほうれん草おひたし + ご飯100g                                                  | 342         | 24        |\n| 間食   | ゆで卵1個                                                                                                                                     | 75          | 6         |\n| **計** |                                                                                                                                               | **約1,451** | **約133** |\n\n### 月\n\n| 食事   | 内容                                                                                                                               | kcal        | P         |\n| ------ | ---------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                                            | 295         | 20        |\n| 昼     | [よだれ鶏](recipes.html#よだれ鶏)（レンジ）150g + ご飯150g + [ブロッコリーの塩ゆで](recipes.html#ブロッコリーの塩ゆで)                 | 437         | 39        |\n| 夕     | [豆腐ステーキ](recipes.html#豆腐ステーキ)200g + [ほうれん草のおひたし](recipes.html#ほうれん草のおひたし)（作り置き）+ ご飯100g + 納豆 | 409         | 23        |\n| 間食   | ゆで卵1個                                                                                                                          | 75          | 6         |\n| **計** |                                                                                                                                    | **約1,468** | **約128** |\n\n### 火（卓球日・ご飯多め）\n\n| 食事   | 内容                                                                                                                      | kcal        | P         |\n| ------ | ------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | B（和定食）ご飯100g                                                                                                       | 362         | 19        |\n| 昼     | [鶏ハム](recipes.html#鶏ハム)（作り置き）120g + ご飯150g + 味噌汁 + [ブロッコリーの塩ゆで](recipes.html#ブロッコリーの塩ゆで) | 417         | 35        |\n| 夕     | 鶏むね150gと野菜の[ちゃんこ風鍋](recipes.html#ちゃんこ風鍋)（キャベツ・玉ねぎ・きのこ・豆腐1/2丁・冷凍分）+ ご飯100g        | 474         | 43        |\n| 間食   | バナナ1本（卓球前後に）                                                                                                   | 90          | 1         |\n| **計** |                                                                                                                           | **約1,565** | **約138** |\n\n※ 火曜は卓球120分の日のため、他の曜日より約100kcal多めに設定している。\n\n### 水（2回目の買い物日）\n\n| 食事   | 内容                                                                                                                                     | kcal        | P         |\n| ------ | ---------------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                                                  | 295         | 20        |\n| 昼     | [サバ缶とキャベツの味噌煮](recipes.html#サバ缶とキャベツの味噌煮)（缶1/2）+ ご飯150g + [にんじんのきんぴら](recipes.html#にんじんのきんぴら) | 492         | 29        |\n| 夕     | [ささみの梅しそ和え](recipes.html#ささみの梅しそ和え)150g + [小松菜炒め](recipes.html#小松菜炒め) + ご飯100g                                 | 402         | 41        |\n| 間食   | ゆで卵1個                                                                                                                                | 75          | 6         |\n| **計** |                                                                                                                                          | **約1,516** | **約136** |\n\n### 木\n\n| 食事   | 内容                                                                                                                  | kcal        | P         |\n| ------ | --------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | B（和定食）ご飯100g                                                                                                   | 362         | 19        |\n| 昼     | [ささみの棒棒鶏](recipes.html#ささみの棒棒鶏)150g + ご飯100g + 味噌汁                                                   | 359         | 42        |\n| 夕     | [鶏むね照り焼き](recipes.html#鶏むね照り焼き)150g（冷凍分）+ [小松菜のおひたし](recipes.html#小松菜のおひたし) + ご飯100g | 417         | 42        |\n| 間食   | ゆで卵1個                                                                                                             | 75          | 6         |\n| **計** |                                                                                                                       | **約1,435** | **約143** |\n\n### 金（余り物整理日）\n\n| 食事   | 内容                                                                                                                             | kcal        | P         |\n| ------ | -------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | C（軽めセット）                                                                                                                  | 300         | 23        |\n| 昼     | [オートミール雑炊](recipes.html#オートミール雑炊)（オートミール40g + 卵1個 + 余り野菜）                                            | 340         | 13        |\n| 夕     | [サバ缶の味噌煮](recipes.html#サバ缶の味噌煮)（缶1/2）+ [残り野菜のコンソメスープ](recipes.html#残り野菜のコンソメスープ) + ご飯100g | 542         | 29        |\n| 間食   | ゆで卵1個                                                                                                                        | 75          | 6         |\n| **計** |                                                                                                                                  | **約1,509** | **約111** |\n\n## 使い切り対応表（余り・買い足し防止）\n\n| 食材                        | 土             | 日       | 月         | 火            | 水     | 木            | 金       |\n| --------------------------- | -------------- | -------- | ---------- | ------------- | ------ | ------------- | -------- |\n| 鶏むね600g                  |                | 昼150    | 昼150      | 夕150（冷凍） |        | 夕150（冷凍） |          |\n| 鮭2切れ                     | 夕             | 夕       |            |               |        |               |          |\n| ほうれん草                  | 夕             | 夕       | 夕（作置） |               |        |               |          |\n| ブロッコリー                |                | 昼       | 昼         | 昼            |        |               |          |\n| ささみ300g（水購入）        |                |          |            |               | 夕150  | 昼150         |          |\n| 小松菜（水購入）            |                |          |            |               | 夕     | 夕            |          |\n| 豆腐（土2丁+水1丁）         |                | 汁       | 汁・夕     | 汁・夕        | 汁     | 汁            | 汁       |\n| キャベツ1/2玉               | 昼（前週残り） |          |            | 夕            | 昼     |               | 夕       |\n| 玉ねぎ・きのこ・にんじん    |                | 夕       |            | 夕            | 昼     |               | 夕       |\n| サバ缶2缶                   |                |          |            |               | 昼半分 |               | 夕半分   |\n| 長ねぎ・レモン              |                | 昼       | 昼         |               |        |               |          |\n| 梅干し・大葉                |                |          |            |               | 夕     |               |          |\n| 卵（土10個 + 水に10個補充） | 朝1・昼2       | 朝1・間1 | 朝1        | 朝1           | 朝1    | 朝1           | 朝2・昼1 |\n\n## 調理のコツ\n\n- **鶏むねは購入日（土曜）に処理**: 150gずつ4等分し、下味（塩こうじ・ネギ塩・照り焼き）をつけて2つは冷凍。パサつき防止と日持ちの両立\n- **まとめ作り（土曜の買い物後30分）**: ゆで卵5個・鶏ハム・ほうれん草のおひたしを作り置き（いずれも土〜月で消費。ゆで卵は水曜の買い物後に追加で作ると後半も楽）\n- **鶏むねをしっとり**: 片栗粉をまぶしてから焼く / レンジ蒸しにする（[Nadiaの鶏むねレシピ集](https://oceans-nadia.com/recipe_list/4081)参照）\n- 味付けの油は1日小さじ1–2（約40–80kcal）まで\n\n## 食材が買えなかったときの代替\n\n売り切れ・欠品は起きる。**タンパク源は必ず代替を買い、副菜は手持ちで置き換える**のが原則。\n\n### 葉物（ほうれん草・小松菜）が買えない\n\n| 本来のメニュー                           | 代替                                                            | kcal |\n| ---------------------------------------- | --------------------------------------------------------------- | ---- |\n| ほうれん草のおひたし / 小松菜のおひたし  | [きのこのおひたし風](recipes.html#きのこのおひたし風)             | 25   |\n| 小松菜炒め                               | [キャベツのごま和え](recipes.html#キャベツのごま和え)             | 60   |\n| 葉物の炒めもの（サバ缶が余っているとき） | [サバ缶とほうれん草の炒め](recipes.html#サバ缶とほうれん草の炒め) | 140  |\n| いずれも                                 | [にんじんのきんぴら](recipes.html#にんじんのきんぴら)             | 80   |\n\n- **冷凍ほうれん草を常備しておくと確実**（1袋200g・約100円、栄養価は生とほぼ同等で、いつでも買える）\n- 葉物は鉄分・カルシウム・葉酸の供給源。代替が続くようなら**水曜の補充買い物で必ず入れる**\n\n### タンパク源が買えない\n\n| 本来   | 代替（同等のP量が取れるもの）                 |\n| ------ | --------------------------------------------- |\n| 鶏むね | ささみ / 鶏もも（皮を外す）/ 豚ヒレ           |\n| 鮭     | サバ缶・ツナ水煮缶 / たら・ぶりなど他の切り身 |\n| ささみ | 鶏むね / サラダチキン                         |\n\n**タンパク源だけは妥協しない。** 手に入らなければ缶詰（サバ水煮・ツナ水煮）で代替する。\n\n## コンビニでタンパク質を確保する（外出・遠征・時間がない日）\n\n**選ぶ基準は「タンパク質1gあたりのkcal」**。この数字が小さいほど、減量中には有利。\n\n| 商品                                | kcal | P   | kcal/P1g | 評価             |\n| ----------------------------------- | ---- | --- | -------- | ---------------- |\n| サラダチキン（プレーン）            | 110  | 23g | **4.8**  | ◎ 最良           |\n| プロテイン粉（持参・水割り1杯）     | 110  | 20g | **5.5**  | ◎                |\n| ザバス ミルクプロテイン 脂肪0 200ml | 100  | 15g | **6.7**  | ○ 手軽さでは一番 |\n| オイコス（フレーバー付き110g）      | 92   | 10g | 9.2      | ○                |\n| ゆで卵1個                           | 75   | 6g  | 12.5     | △ 補助的に       |\n| 1本満足バー プロテイン              | 190  | 15g | 12.7     | △                |\n| inバー プロテイン ベイクドチョコ    | 213  | 10g | **21.3** | ✗ 実質チョコ菓子 |\n\n- **プロテインバーは避ける。** 生地やチョコの分でカロリーが膨らみ、効率が粉の2〜4倍悪い\n- **ドリンクタイプ（ザバス等）が現実的な代替。** 冷蔵で売られていて、その場で飲める\n- **サラダチキンが最強**だが、食事として食べるものなので間食には向かない場面もある\n\n## 参考にしたレシピ・献立ソース\n\n- [Nadia「鶏むね肉のダイエットレシピ」30選](https://oceans-nadia.com/recipe_list/4081) — レンジ蒸し鶏・ネギ塩レモン焼き・だし鶏ハム等\n- [Nadia 高タンパクレシピランキング](https://oceans-nadia.com/recipe/tag/%E9%AB%98%E3%82%BF%E3%83%B3%E3%83%91%E3%82%AF)\n- [クックパッド「高タンパク 鶏胸肉」](https://cookpad.com/jp/search/%E9%AB%98%E3%82%BF%E3%83%B3%E3%83%91%E3%82%AF%20%E9%B6%8F%E8%83%B8%E8%82%89)\n- [ECOFIT24 減量中の食事法と1週間メニュー](https://www.ecofit24.com/column/trainee-weight-loss-diet-guide/) — トレーニング日/休養日のカロリー調整方式\n- [すぐくるクリニック 1週間献立（1,500–1,700kcal）](https://sugukuru-clinic.com/diet/weight-loss-meal-plan-2/) — 和食中心のPFC設計\n- [VADY 男性ダイエットカロリー攻略](https://vady.jp/article/male-diet-calorie-guide/) — タンパク質 体重×1.6–2.0g の根拠\n- [1700 Calorie Meal Plan: 7-Day Guide With Grocery List](https://www.planeatai.com/blog/1700-calorie-meal-plan-2026) — 買い物リスト付きプランの構成参考\n";

// 見出しにGitHub風のアンカーidを付与する（日本語は保持、空白はハイフン、記号は除去）。
// menu.html からの recipes.html#料理名 のようなアンカーリンクを機能させるため。
(function () {
  const seen = new Set();
  document.querySelectorAll('.md h1,.md h2,.md h3,.md h4,.md h5,.md h6').forEach(function (h) {
    const base = h.textContent
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[!-/:-@[-\`{-~、。・（）［］「」『』：；？！　]/g, '');
    let id = base;
    let n = 1;
    while (document.getElementById(id) || seen.has(id)) {
      id = base + '-' + n;
      n += 1;
    }
    seen.add(id);
    h.id = id;
  });
})();

document.querySelectorAll('.md table').forEach(function (t) {
  const box = document.createElement('div');
  box.className = 'table-scroll';
  t.parentNode.insertBefore(box, t);
  box.appendChild(t);
});

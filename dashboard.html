<script>
const DATA = {"summary":{"current":77.4,"currentDate":"2026-08-06","currentBodyFat":24.6,"goal":70,"lost":0,"remaining":7.4,"percent":0,"projection":null,"calorieTarget":1700,"proteinTarget":115},"weightChart":[{"date":"2026-08-06","weight":77.4,"bodyFat":24.6,"planned":77.4}],"daily":[],"weeks":[{"weekStart":"2026-08-03","avgWeight":77.4}],"goalDate":"2026-11-06","planMd":"# 減量・体力増強計画書\n\n作成日: 2026-08-06\n\n## 基本情報\n\n| 項目        | 値                       |\n| ----------- | ------------------------ |\n| 年齢 / 性別 | 46歳 / 男性              |\n| 身長        | 178cm                    |\n| 体重        | 77.4kg                   |\n| 体脂肪率    | 24.6%                    |\n| BMI         | 24.4（標準上限ギリギリ） |\n| 現在の運動  | 週1回 卓球90分           |\n\n参考: 脂肪量 約19.0kg / 除脂肪体重 約58.4kg\n\n## 目標\n\n- **体重 70kg 以下（-7.4kg）**\n- 期間: **2026-08-06 → 2026-11-06（3ヶ月・約13週）**\n- 計画ペース: **約0.6kg/週**\n- 筋肉を維持しながら脂肪を落とし、体脂肪率 20% 前後を目安にする\n- 筋力・体力の増強（自重トレ・有酸素の習慣化）\n\n## カロリー設計（数値根拠）\n\n| 項目              | 値                | 算出                                           |\n| ----------------- | ----------------- | ---------------------------------------------- |\n| 基礎代謝 BMR      | 約1,660 kcal      | Mifflin-St Jeor: 10×77.4 + 6.25×178 − 5×46 + 5 |\n| 消費カロリー TDEE | 約2,330 kcal      | BMR × 活動係数1.4（週1運動）                   |\n| **摂取目標**      | **1,700 kcal/日** | TDEE − 約630 kcal                              |\n\n- 赤字: 約630 kcal/日 → 週 約4,400 kcal ≒ 脂肪 0.57kg/週（脂肪1kg = 7,700 kcal 換算）\n- 13週 × 0.57kg ≒ **7.4kg 減** で目標達成の計算\n\n## PFC 目標（1日あたり）\n\n| 栄養素     | 目標         | kcal換算 |\n| ---------- | ------------ | -------- |\n| タンパク質 | **110–120g** | 約460    |\n| 脂質       | 約50g        | 約450    |\n| 炭水化物   | 約190g       | 約760    |\n\n- **プロテイン（定期購入済み）を1日1–2杯**（P 20–40g）飲む前提。食事側は P 80–90g を目安に確保\n- タンパク質を削らないことが筋肉維持の条件\n\n## 食事方針\n\n- 具体的な1週間メニューと買い物リストは **[menu.md](menu.md)** を参照（週1–2回の買い物で使い切る設計）\n- 間食・砂糖入り飲料は原則なし。アルコールは控えめ（週2回以内・1回1杯程度まで）\n- 夕食は就寝3時間前までに済ませる\n- 食べたものはその都度このチャットに報告 → カロリー・PFCを推定して記録する\n\n## 運動計画（自宅 夕・木昼・日夕（長持ち）                                             |\n| きのこ（しめじ等）                           | 2パック   | 火夕・日夕                                                             |\n| にんじん                                     | 2本       | 副菜・スープ（長持ち）                                                 |\n| サバ水煮缶                                   | 2缶       | 木昼・日夕（保存食・後半用）                                           |\n| （ストック品）米・オートミール・味噌・調味料 | 切れたら  | 全期間                                                                 |\n\n### 週半ば（2回目の買い物・水曜目安）\n\n| 食材                 | 量                | 使うメニュー                     |\n| -------------------- | ----------------- | -------------------------------- |\n| ささみ               | 300g              | 木夕・金昼                       |\n| 木綿豆腐             | 1丁               | 土夕・日の汁物                   |\n| 卵                   | 10個              | 週の消費は約12個。水曜に必ず補充 |\n| 小松菜 or ほうれん草 | 1袋               | 木〜土の副菜（葉物の補充）       |\n| バナナ               | 1房（残数を見て） | 朝・間食                         |\n\n## 曜日別メニュー\n\n※ 各食事は「内容（概算kcal / P）」。日合計にはプロテイン2杯（220kcal / P40g）を含む。\n\n### 月（鮮度優先: 鮭・ほうれん草）\n\n| 食事   | 内容                                                          | kcal        | P         |\n| ------ | ------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                       | 295         | 20        |\n| 昼     | 鶏むねネギ塩レモン焼き150g + ご飯200g + 味噌汁 + ブロッコリー | 565         | 44        |\n| 夕     | 鮭の塩焼き1切れ + ほうれん草おひたし + ご飯150g + 納豆        | 460         | 31        |\n| 間食   | バナナ1/2                                                     | 45          | 1         |\n| **計** |                                                               | **約1,585** | **約136** |\n\n### 火（卓球日・ご飯多め）\n\n| 食事   | 内容                                                            | kcal        | P         |\n| ------ | --------------------------------------------------------------- | ----------- | --------- |\n|

const DATA = {"summary":{"current":77.4,"currentDate":"2026-08-06","currentBodyFat":24.6,"goal":70,"lost":0,"remaining":7.4,"percent":0,"projection":null,"calorieTarget":1700,"proteinTarget":115},"weightChart":[{"date":"2026-08-06","weight":77.4,"bodyFat":24.6,"planned":77.4}],"daily":[],"weeks":[{"weekStart":"2026-08-03","avgWeight":77.4}],"goalDate":"2026-11-06","planMd":"# 減量・体力増強計画書\n\n作成日: 2026-08-06\n\n## 基本情報\n\n| 項目        | 値                       |\n| ----------- | ------------------------ |\n| 年齢 / 性別 | 46歳 / 男性              |\n| 身長        | 178cm                    |\n| 体重        | 77.4kg                   |\n| 体脂肪率    | 24.6%                    |\n| BMI         | 24.4（標準上限ギリギリ） |\n| 現在の運動  | 週1回 卓球90分           |\n\n参考: 脂肪量 約19.0kg / 除脂肪体重 約58.4kg\n\n## 目標\n\n- **体重 70kg 以下（-7.4kg）**\n- 期間: **2026-08-06 → 2026-11-06（3ヶ月・約13週）**\n- 計画ペース: **約0.6kg/週**\n- 筋肉を維持しながら脂肪を落とし、体脂肪率 20% 前後を目安にする\n- 筋力・体力の増強（自重トレ・有酸素の習慣化）\n\n## カロリー設計（数値根拠）\n\n| 項目              | 値                | 算出                                           |\n| ----------------- | ----------------- | ---------------------------------------------- |\n| 基礎代謝 BMR      | 約1,660 kcal      | Mifflin-St Jeor: 10×77.4 + 6.25×178 − 5×46 + 5 |\n| 消費カロリー TDEE | 約2,330 kcal      | BMR × 活動係数1.4（週1運動）                   |\n| **摂取目標**      | **1,700 kcal/日** | TDEE − 約630 kcal                              |\n\n- 赤字: 約630 kcal/日 → 週 約4,400 kcal ≒ 脂肪 0.57kg/週（脂肪1kg = 7,700 kcal 換算）\n- 13週 × 0.57kg ≒ **7.4kg 減** で目標達成の計算\n\n## PFC 目標（1日あたり）\n\n| 栄養素     | 目標         | kcal換算 |\n| ---------- | ------------ | -------- |\n| タンパク質 | **110–120g** | 約460    |\n| 脂質       | 約50g        | 約450    |\n| 炭水化物   | 約190g       | 約760    |\n\n- **プロテイン（定期購入済み）を1日1–2杯**（P 20–40g）飲む前提。食事側は P 80–90g を目安に確保\n- タンパク質を削らないことが筋肉維持の条件\n\n## 食事方針\n\n- 具体的な1週間メニューと買い物リストは **[menu.md](menu.md)** を参照（週1–2回の買い物で使い切る設計）\n- 間食・砂糖入り飲料は原則なし。アルコールは控えめ（週2回以内・1回1杯程度まで）\n- 夕食は就寝3時間前までに済ませる\n- 食べたものはその都度このチャットに報告 → カロリー・PFCを推定して記録する\n\n## 運動計画（自宅 を少しずつ延ばす\n\n## 計測・記録ルール\n\n- **毎朝、起床後・排泄後・食前**に体重・体脂肪率を計測し、このチャットで報告する\n- 食事・運動・睡眠はその都度チャットで報告 → Claude がデータに記録しダッシュボードを更新\n- 見える化: `dashboard.html`（体重推移・目標線・カロリー・運動履歴）\n\n## 見直しルール\n\n- **2週間以上体重が停滞** → 摂取カロリーを100–200kcal下げるか、有酸素を1回追加\n- **週1kgを超えるペースで減少** → 筋肉低下のリスク。摂取を1,800–1,900kcalに戻す\n- **強い疲労・体調不良** → ペースダウン。無理をしない\n\n## 注意事項\n\n3ヶ月で7.4kgはやや速いペース。タンパク質の確保と筋トレで筋肉の低下を防ぐことが成功の鍵。体調に異常を感じた場合は計画を中止し、医師に相談すること。\n","menuMd":"# 週間メニュー & 買い物計画\n\n1日の目標: **約1,700kcal / タンパク質 110g 以上（120g前後）**（plan.md 参照）\n買い物は **週2回**（週初・週半ば）で済み、食材を使い切る設計。\n数値はすべて概算。お腹の空き具合・体重の落ちペースに応じて **ご飯の量（±50–100g）で調整** する。\n\n## 1日の型\n\n| 食事       | 内容                                                 |\n| ---------- | ---------------------------------------------------- |\n| 朝         | 下記 A / B / C のローテーション                      |\n| 昼         | メイン（肉・魚・卵）+ ご飯 + 汁物 or 副菜            |\n| 夕         | メイン + 副菜 + ご飯                                 |\n| プロテイン | **1日2杯**（朝・運動後など。1杯 = 約110kcal / P20g） |\n\n### 朝食パターン（固定化して迷わない）\n\n|                   | 内容                                                                                              | kcal  | P     |\n| ----------------- | ------------------------------------------------------------------------------------------------- | ----- | ----- |\n| A（オートミール） | [オートミール](recipes.md#オートミールの基本)30g + ギリシャヨーグルト100g + バナナ1/2 + ゆで卵1個 | 約295 | 約20g |\n| B（和定食）       | ご飯150g + 納豆 + 卵1個 + [味噌汁](recipes.md#味噌汁)（豆腐・わかめ）                             | 約440 | 約20g |\n| C（軽め）         | ギリシャヨーグルト100g + バナナ1本 + ゆで卵2個                                                    | 約300 | 約23g |\n\n## 買い物リスト\n\n### 週初（1回目の買い物）\n\n| 食材                                         | 量        | 使うメニュー                                                           |\n| -------------------------------------------- | --------- | ---------------------------------------------------------------------- |\n| 鶏むね肉（皮なし）                           | 600g      | 月昼・火昼・金夕・土夕（150g×4に分け、購入日に下味をつけて半分は冷凍） |\n| ・水曜目安）\n\n| 食材                 | 量                | 使うメニュー                     |\n| -------------------- | ----------------- | -------------------------------- |\n| ささみ               | 300g              | 木夕・金昼                       |\n| 木綿豆腐             | 1丁               | 土夕・日の汁物                   |\n| 卵                   | 10個              | 週の消費は約12個。水曜に必ず補充 |\n| 小松菜 or ほうれん草 | 1袋               | 木夕（炒め）・金夕（おひたし）   |\n| 大葉                 | 1パック           | 木夕（ささみの梅しそ和え）       |\n| バナナ               | 1房（残数を見て） | 朝・間食                         |\n\n## 曜日別メニュー\n\n※ 各食事は「内容（概算kcal / P）」。日合計にはプロテイン2杯（220kcal / P40g）を含む。\n※ 料理名は作り方ページ [recipes.md](recipes.md) へのリンク。\n\n### 月（鮮度優先: 鮭・ほうれん草）\n\n| 食事   | 内容                                                                                                                                          | kcal        | P         |\n| ------ | --------------------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                                                       | 295         | 20        |\n| 昼     | [鶏むねネギ塩レモン焼き](recipes.md#鶏むねネギ塩レモン焼き)150g + ご飯200g + 味噌汁 + [ブロッコリーの塩ゆで](recipes.md#ブロッコリーの塩ゆで) | 565         | 44        |\n| 夕     | [鮭の塩焼き](recipes.md#鮭の塩焼き)1切れ + [ほうれん草おひたし](recipes.md#ほうれん草のおひたし) + ご飯150g + 納豆                            | 460         | 31        |\n| 間食   | バナナ1/2                                                                                                                                     | 45          | 1         |\n| **計** |                                                                                                                                               | **約1,585** | **約136** |\n\n### 火（卓球日・ご飯多め）\n\n| 食事   | 内容                                          | **約1,665** | **約121** |\n\n### 木\n\n| 食事   | 内容                                                                                                                                     | kcal        | P         |\n| ------ | ---------------------------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | B（和定食）                                                                                                                              | 440         | 20        |\n| 昼     | [サバ缶とキャベツの味噌煮](recipes.md#サバ缶とキャベツの味噌煮)（缶1/2）+ ご飯200g + [にんじんのきんぴら](recipes.md#にんじんのきんぴら) | 570         | 30        |\n| 夕     | [ささみの梅しそ和え](recipes.md#ささみの梅しそ和え)150g + [小松菜炒め](recipes.md#小松菜炒め) + ご飯150g                                 | 480         | 42        |\n| 間食   | ギリシャヨーグルト100g                                                                                                                   | 60          | 10        |\n| **計** |                                                                                                                                          | **約1,770** | **約142** |\n\n### 金\n\n| 食事   | 内容                                                                                                                  | kcal        | P         |\n| ------ | --------------------------------------------------------------------------------------------------------------------- | ----------- | --------- |\n| 朝     | A（オートミールセット）                                                                                               | 295         | 20        |\n| 昼     | [ささみの棒棒鶏](recipes.md#ささみの棒棒鶏)150g + ご飯200g + 味噌汁                                                   | 515         | 44        |\n| 夕     | [鶏むね照り焼き](recipes.md#鶏むね照り焼き)150g（冷凍分）+ [小松菜のおひたし](recipes.md#小松菜のおひたし) + ご飯150g | 495         | 43        |\n| 間食   | バナナ1本 | 間食   | バナナ1本                                                                                                                        | 90          | 1         |\n| **計** |                                                                                                                                  | **約1,710** | **約104** |\n\n## 使い切り対応表（余り・買い足し防止）\n\n| 食材                          | 月    | 火    | 水             | 木     | 金            | 土            | 日       |\n| ----------------------------- | ----- | ----- | -------------- | ------ | ------------- | ------------- | -------- |\n| 鶏むね600g                    | 昼150 | 昼150 |                |        | 夕150（冷凍） | 夕150（冷凍） |          |\n| 鮭2切れ                       | 夕    | 夕    |                |        |               |               |          |\n| ほうれん草                    | 夕    | 夕    | 夕（作り置き） |        |               |               |          |\n| 小松菜（水購入）              |       |       |                | 夕     | 夕            |               |          |\n| ブロッコリー                  | 昼    | 昼    | 昼             |        |               |               |          |\n| ささみ300g（水購入）          |       |       |                | 夕150  | 昼150         |               |          |\n| 豆腐（週初1丁+水1丁）         | 汁    | 汁    | 夕             |        |               | 夕            | 汁       |\n| キャベツ1/2玉                 |       |       |                | 昼     |               | 昼            | 夕       |\n| 玉ねぎ・きのこ・にんじん      |       | 夕    |                | 昼     |               | 夕            | 夕       |\n| サバ缶2缶                     |       |       |                | 昼半分 |               |               | 夕半分   |\n| 長ねぎ・レモン                | 昼    | 昼    |                |        |               |               |          |\n| 梅干し・大葉                  |       |       |                | 夕     |               |               |          |\n| 卵（週初10個 + 水に10個補充） | 朝1   | 朝1   | 朝1            | 朝1    | 朝1           | 朝2・昼2・間1 | 朝1・昼1 |\n\n## 調理のコツ\n\n- **鶏むねは購入日に処理**: 150gずつ4等分し、下味（塩こうじ・ネギ塩・照り焼き）をつけて2つは冷凍。パサつき防止と日持ちの両立\n- **まとめ作り（週初30分）**: ゆで卵5個・鶏ハム・ほうれん草のおひたしを作り置き\n- **鶏むねをしっとり**: 片栗粉をまぶしてから焼く / レンジ蒸しにする（[Nadiaの鶏むねレシピ集](https://oceans-nadia.com/recipe_list/4081)参照）\n- 味付けの油は1日小さじ1–2（約40–80kcal）まで\n\n## 参考にしたレシピ・献立ソース\n\n- [Nadia「鶏むね肉のダイエットレシピ」30選](https://oceans-nadia.com/recipe_list/4081) — レンジ蒸し鶏・ネギ塩レモン焼き・だし鶏ハム等\n- [Nadia 高タンパクレシピランキング](https://oceans-nadia.com/recipe/tag/%E9%AB%98%E3%82%BF%E3%83%B3%E3%83%91%E3%82%AF)\n- [クックパッド「高タンパク 鶏胸肉」](https://cookpad.com/jp/search/%E9%AB%98%E3%82%BF%E3%83%B3%E3%83%91%E3%82%AF%20%E9%B6%8F%E8%83%B8%E8%82%89)\n- [ECOFIT24 減量中の食事法と1週間メニュー](https://www.ecofit24.com/column/trainee-weight-loss-diet-guide/) — トレーニング日/休養日のカロリー調整方式\n- [すぐくるクリニック 1週間献立（1,500–1,700kcal）](https://sugukuru-clinic.com/diet/weight-loss-meal-plan-2/) — 和食中心のPFC設計\n- [VADY 男性ダイエットカロリー攻略](https://vady.jp/article/male-diet-calorie-guide/) — タンパク質 体重×1.6–2.0g の根拠\n- [1700 Calorie Meal Plan: 7-Day Guide With Grocery List](https://www.planeatai.com/blog/1700-calorie-meal-plan-2026) — 買い物リスト付きプランの構成参考\n","recipesMd":"# レシピ集\n\n[menu.md](menu.md) の各料理の作り方。分量はすべて1人分（特記なし）。\n調理時間はいずれも5–15分。味付けの油は1日小さじ1–2まで（plan.md 参照）。\n\n## 主菜\n\n### 鶏むねネギ塩レモン焼き\n\n材料: 鶏むね肉150g / 長ねぎ1/3本 / レモン汁 小さじ1 / 塩こしょう少々 / 油 小さじ1/2\n\n1. 鶏むねは5mm厚のそぎ切りにし、塩こしょうをもみ込む\n2. フライパンに油を熱し、中火で片面2–3分ずつ焼く\n3. 刻んだねぎ・レモン汁・塩ひとつまみを混ぜてかける\n\n### よだれ鶏\n\n材料: 鶏むね150g / 酒 大さじ1 / タレ（醤油・酢 各大さじ1、砂糖 小さじ1、ごま油・辣油 各小さじ1/2、すりごま 小さじ1、刻みねぎ）\n\n1. 耐熱皿に鶏むねと酒を入れ、ふんわりラップして600Wで2分。裏返して1分半、ラップしたまま5分置く\n2. タレの材料をすべて混ぜる\n3. 薄切りにした鶏にタレをかける\n\n### 鶏ハム\n\n材料（作り置き・週に1回）: 鶏むね1枚（約300g）/ 塩 小さじ1/2 / 砂糖 小さじ1/2 / こしょう少々\n\n1. 鶏むねに調味料をすり込み、保存袋の空気を抜いて一晩（最低1時間）冷蔵で寝かせる\n2. 袋ごと沸騰した湯に入れて火を止め、蓋をして20分放置\n3. 粗熱を取って薄切りに。冷蔵で3日保存可\n\n### 豆腐ステーキ\n\n材料: 木綿豆腐200g / 片栗粉 適量 / 油 小さじ1/2 / 醤油・みりん 各小さじ2\n\n1. 豆腐はキッチンペーパーに包み10分水切りする\n2. 片栗粉をまぶし、油を熱したフライパンで両面こんがり焼く\n3. 醤油・みりんを回し入れ、からめながら30秒煮る\n\n### サバ缶とキャベツの味噌煮\n\n材料: サバ水煮缶1/2缶 / キャベツ2枚 / 味噌 大さじ1 / みりん 大さじ1/2 / 水50ml\n\n1. 小鍋に水・味噌・みりんを溶かし、ざく切りのキャベツを中火で3分煮る\n2. サバを缶汁ごと加え、さらに2分煮る\n\n### ささみの梅しそ和え\n\n材料: ささみ150g / 梅干し1個 / 大葉3枚 / 酒 大さじ1\n\n1. ささみは筋を取り、酒をふりラップして600Wで1分半〜2分加熱\n2. 粗熱を取り、食べやすくほぐす\n3. 種を取って叩いた梅干しと千切りの大葉を和える\n\n### ささみの棒棒鶏\n\n材料: ささみ150g / ごまだれ（練りごま 大さじ1・醤油 小さじ2・酢 小さじ1・砂糖 小さじ1/2）/ 酒 大さじ1\n\n1. ささみは「梅しそ和え」と同じ手順でレンジ加熱してほぐす\n2. ごまだれの材料を混ぜ、ささみと和える\n\n### 鶏むね照り焼き\n\n材料: 鶏むね150g（下味冷凍分を前日冷蔵解凍）/ 醤油・みりん・酒 各大さじ1 / 砂糖 小さじ1\n\n1. 鶏むねを一口大に切り、フライパンで両面に焼き色をつける\n2. 調味料をすべて加え、とろみがつくまで中火で煮からめる\n\n### 納豆オムレツ\n\n材料: 卵2個 / 納豆1パック / 油 小さじ1/2 / （あれば千切りキャベツ）\n\n1. 納豆に溶き卵を混ぜる（付属のタレも入れてよい）\n2. 油を熱したフライパンに流し、両面を焼いて半分に折る\n\n### ちゃんこ風鍋\n\n材料: 鶏むね150g（一口大）/ キャベツ1–2枚・玉ねぎ1/4個・きのこ1/2パック・豆腐1/2丁 / 水300ml / 鶏がらスープの素 小さじ1 / 醤油 小さじ2\n\n1. 鍋に水とスープの素を沸かし、鶏むね・キャベツ・玉ねぎ・きのこを中火で7–8分煮る\n2. 豆腐を加えて2分煮て、醤油で味を調える\n\n### サバ缶の味噌煮\n\n材料: サバ水煮缶1/2缶 / 味噌 大さじ1 / みりん・酒 各小さじ2 / 生姜（チューブ可）少々 / 水50ml\n\n1. 小鍋に水・味噌・みりん・酒・生姜を溶かして煮立てる\n2. サバを缶汁ごと入れ、中火で3分煮る\n\n### 鮭の塩焼き\n\n材料: 生鮭1切れ / 塩 少々\n\n1. 鮭に軽く塩をふり5分置く\n2. 魚焼きグリル、またはフライパン（薄く油・蓋あり弱中火）で片面4–5分ずつ焼く\n\n### 鮭のホイル焼き\n\n材料: 生鮭1切れ / 玉ねぎ1/4個・きのこ1/2パック / 塩こしょう少々 / （あればバター5g または ポン酢）\n\n1. アルミホイルに鮭と野菜を乗せ、塩こしょうする\n2. 包んでフライパンに置き、水大さじ2を回りに入れて蓋をし、弱中火で10分蒸し焼きにする\n\n## 副菜\n\n### ほうれん草のおひたし\n\n材料: ほうれん草1袋 / 醤油 小さじ2 / （あれば鰹節）\n\n1. 沸騰した湯で1分茹で、冷水に取り水気を強めに絞る\n2. 4–5cmに切り、醤油をかける\n3. 作り置きする場合は小分けにして冷蔵2日（水曜夕食分までカバー）\n\n### ブロッコリーの塩ゆで\n\n材料: ブロッコリー適量 / 塩 少々\n\n1. 小房に分け、塩を入れた熱湯で2分茹でる。歯応えを残す\n\n### にんじんのきんぴら\n\n材料: にんじん1/2本 / 油 小さじ1/2 / 醤油・みりん 各小さじ1\n\n1. にんじんを千切りにし、油で中火2分炒める\n2. 醤油・みりんを絡めて1分炒める\n\n### 小松菜のおひたし\n\nほうれん草のおひたしと同じ手順。\n\n### 小松菜炒め\n\n材料: 小松菜1/2袋 / 油 小さじ1/2 / 塩こしょう・にんにく（チューブ可）少々\n\n1. ざく切りにし、油とにんにくで中火2分炒めて調味する\n\n### キャベツサラダ\n\n材料: キャベツ1–2枚 / 塩こしょう少々 / オリーブ油 小さじ1/2（または胡麻ドレッシング少々）\n\n1. 千切りにして水にさらし、よく水気を切って調味する\n\n### 残り野菜のコンソメスープ\n\n材料: 余った野菜・きのこ 適量 / 水200ml / コンソメ 小さじ1\n\n1. すべて鍋に入れて中火5分煮るだけ\n\n### 味噌汁\n\n材料: 水150ml / 味噌 大さじ1弱 / 豆腐（1/6丁程度）・乾燥わかめ 適量\n\n1. 水に豆腐・わかめを入れて煮る\n2. 火を止めてから味噌を溶く（煮立てると風味が落ちる）\n\n## 朝食パターンの作り方\n\n### オートミールの基本\n\n朝Aで使う戻し方。\n\n1. オートミール30gに水60mlを注ぎ、600Wで1分チンしてぬるま粥状にする\n2. 苦手な場合の対策: 水→牛乳にする / バナナときな粉（またははちみつ少量）を混ぜる / だしで煮て雑炊風にする（下記「オートミール雑炊」）\n\n### オートミール雑炊\n\n材料: オートミール40g / 卵1個 / 余り野菜 / 水150ml / 鶏がらスープの素 小さじ1/2\n\n1. 水とスープの素を沸かし、オートミールと刻んだ野菜を2–3分煮る\n2. 溶き卵を回し入れたら火を止める\n\n### ゆで卵\n\n1. 沸騰した湯に冷蔵庫からの卵をそっと入れ、10分茹でる\n2. 冷水で急冷する（殻がむきやすくなる）\n3. まとめ作りする場合は5個。殻をむいて冷蔵3日\n\n### 朝B（和定食）・朝C（軽めセット）\n\n- 朝B: ご飯を炊き、味噌汁（上記）・納豆・卵を並べるだけ\n- 朝C: ギリシャヨーグルト・バナナ・ゆで卵（作り置き）を盛るだけ\n\n## 作り置き・下味冷凍\n\n### 鶏むねの下味冷凍\n\n1. 購入日に150gずつ4等分に切り分ける\n2. 2つ（金・土用）に下味をもみ込む — 照り焼き用: 醤油・みりん各大さじ1/2 / 鍋用: 塩こしょうのみ\n3. 保存袋に平らに入れて冷凍。使う前日に冷蔵庫へ移して解凍\n\n### 週初のまとめ作り（30分）\n\n1. ゆで卵5個 → 朝食・間食用\n2. 鶏ハム1枚分 → 水曜昼用\n3. ほうれん草のおひたし → 月・火・水の夕食用\n"};

document.querySelectorAll('.tab').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
    document.querySelectorAll('.tab-pane').forEach(function (pane) { pane.hidden = pane.id !== 'tab-' + btn.dataset.tab; });
  });
});

const weightCtx = document.getElementById('weight-chart');
new Chart(weightCtx, {
  data: {
    labels: DATA.weightChart.map(function (w) { return w.date; }),
    datasets: [
      {
        type: 'line',
        label: '体重(kg)',
        data: DATA.weightChart.map(function (w) { return w.weight; }),
        borderColor: '#2563eb',
        backgroundColor: '#2563eb',
        tension: 0.2,
        yAxisID: 'y',
      },
      {
        type: 'line',
        label: '体脂肪率(%)',
        data: DATA.weightChart.map(function (w) { return w.bodyFat; }),
        borderColor: '#f59e0b',
        backgroundColor: '#f59e0b',
        tension: 0.2,
        spanGaps: true,
        yAxisID: 'y2',
      },
      {
        type: 'line',
        label: '目標 ' + DATA.summary.goal + 'kg',
        data: DATA.weightChart.map(function () { return DATA.summary.goal; }),
        borderColor: '#ef4444',
        borderDash: [6, 4],
        pointRadius: 0,
        borderWidth: 1.5,
        yAxisID: 'y',
      },
      {
        type: 'line',
        label: '計画ペース',
        data: DATA.weightChart.map(function (w) { return w.planned; }),
        borderColor: '#94a3b8',
        borderDash: [2, 3],
        pointRadius: 0,
        borderWidth: 1.5,
        spanGaps: true,
        yAxisID: 'y',
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      y: { position: 'left', title: { display: true, text: 'kg' } },
      y2: { position: 'right', title: { display: true, text: '%' }, grid: { drawOnChartArea: false } },
    },
  },
});

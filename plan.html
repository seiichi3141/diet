<script>
const MD = "# 減量・体力増強計画書\n\n作成日: 2026-08-06\n\n## 基本情報\n\n| 項目        | 値                       |\n| ----------- | ------------------------ |\n| 年齢 / 性別 | 46歳 / 男性              |\n| 身長        | 178cm                    |\n| 体重        | 77.4kg                   |\n| 体脂肪率    | 24.6%                    |\n| BMI         | 24.4（標準上限ギリギリ） |\n| 現在の運動  | 週1回 卓球90分           |\n\n参考: 脂肪量 約19.0kg / 除脂肪体重 約58.4kg\n\n## 目標\n\n- **体重 70kg 以下（-7.4kg）**\n- 期間: **2026-08-06 → 2026-11-06（3ヶ月・約13週）**\n- 計画ペース: **約0.6kg/週**\n- 筋肉を維持しながら脂肪を落とし、体脂肪率 20% 前後を目安にする\n- 筋力・体力の増強（自重トレ・有酸素の習慣化）\n\n## カロリー設計（数値根拠）\n\n| 項目              | 値                | 算出                                           |\n| ----------------- | ----------------- | ---------------------------------------------- |\n| 基礎代謝 BMR      | 約1,660 kcal      | Mifflin-St Jeor: 10×77.4 + 6.25×178 − 5×46 + 5 |\n| 消費カロリー TDEE | 約2,330 kcal      | BMR × 活動係数1.4（週1運動）                   |\n| **摂取目標**      | **1,700 kcal/日** | TDEE − 約630 kcal                              |\n\n- 赤字: 約630 kcal/日 → 週 約4,400 kcal ≒ 脂肪 0.57kg/週（脂肪1kg = 7,700 kcal 換算）\n- 13週 × 0.57kg ≒ **7.4kg 減** で目標達成の計算\n\n## PFC 目標（1日あたり）\n\n| 栄養素     | 目標         | kcal換算 |\n| ---------- | ------------ | -------- |\n| タンパク質 | **110–120g** | 約460    |\n| 脂質       | 約50g        | 約450    |\n| 炭水化物   | 約190g       | 約760    |\n\n- **プロテイン（定期購入済み）を1日1–2杯**（P 20–40g）飲む前提。食事側は P 80–90g を目安に確保\n- タンパク質を削らないことが筋肉維持の条件\n\n## 食事方針\n\n- 具体的な1週間メニューと買い物リストは **[menu.md](menu.html)** を参照（週1–2回の買い物で使い切る設計）\n- 間食・砂糖入り飲料は原則なし。アルコールは控えめ（週2回以内・1回1杯程度まで）\n- 夕食は就寝3時間前までに済ませる\n- 食べたものはその都度このチャットに報告 → カロリー・PFCを推定して記録する\n\n## 運動計画（自宅・屋外中心、ジム不要）\n\n| 種類                     | 頻度    | 内容                                                                                     |\n| ------------------------ | ------- | ---------------------------------------------------------------------------------------- |\n| 卓球                     | 週1回   | 90分（**火曜日**・現行継続）                                                             |\n| 自重トレ                 | 週2–3回 | スクワット / 腕立て / プランク / ランジ / 腹筋 各2–3セット（筋肉量維持が主目的）         |\n| 有酸素                   | 週2–3回 | 簡易エアロバイク 20–30分、または外でのランニング（最初は快走〜ゆっくりラン20分程度から） |\n| **20mシャトルラン**      | 週1回   | 卓球の体力作り用（金曜）。詳細は下記「20mシャトルラン」                                  |\n| （オプション）体育館ジム | 週1–2回 | 必要な場合のみ。自重トレの置き換え・負荷向上用                                           |\n\n週間スケジュール（卓球は火曜固定）:\n\n| 曜日 | 内容                                |\n| ---- | ----------------------------------- |\n| 月   | 自重トレ                            |\n| 火   | **卓球（90分）**                    |\n| 水   | 休み or 軽めのエアロバイク          |\n| 木   | 自重トレ                            |\n| 金   | **20mシャトルラン** or エアロバイク |\n| 土   | 自重トレ or ランニング（調整日）    |\n| 日   | 休み                                |\n\n### 自重トレの具体メニュー（週2–3回・1回20–30分）\n\n| #   | 種目       | 回数・時間 | セット | ポイント                                                     |\n| --- | ---------- | ---------- | ------ | ------------------------------------------------------------ |\n| 1   | スクワット | 10–15回    | 3      | 脚・お尻の大きな筋肉。膝はつま先と同じ方向、お尻を後ろに引く |\n| 2   | 腕立て伏せ | 8–12回     | 2–3    | 胸・腕。きつければ膝つきでOK                                 |\n| 3   | ランジ     | 左右各10回 | 2      | 脚・バランス。前足の膝が90度になるまで腰を落とす             |\n| 4   | プランク   | 30–60秒    | 2–3    | 体幹。頭からかかとまで一直線、腰を落とさない                 |\n| 5   | クランチ   | 15回       | 2      | 腹筋。腰を守るため肩甲骨が浮く程度まで起き上がる             |\n\n- セット間の休憩: 60–90秒\n- 開始前に軽いストレッチ5分（ウォームアップ）\n- 筋肉痛が残っていたら1日ずらす。無理に連続させない\n- **慣れてきたら**: 各種目の回数を+5ずつ増やす、または3秒かけてゆっくり下ろす（スロートレーニング化）で負荷を上げる\n- さらに余裕が出たら体育館ジム（オプション）でマシン・ダンベルに移行するのも有効\n\n### 有酸素の内容\n\n- **エアロバイク**: 20–30分。軽く息が弾むが会話はできる強度（心拍数の目安 120–130）\n- **ランニング**: いきなり走り続けず、「1分走る + 2分歩く」×5セット程度のウォーク＆ランから開始。膝・足首をいたわる\n- 2–3週間続けて余裕が出たら、走る時間を少しずつ延ばす\n\n### 20mシャトルラン（卓球の体力作り）\n\n20mを往復し、そのたびに減速・切り返し・再加速を繰り返す間欠的高強度運動。**ラリー中の動きと負荷特性が近く、卓球の粘り（後半のフットワーク維持）に直結する**。全身持久力（最大酸素摂取量）を上げる効果も高い。\n\n#### 場所・装備\n\n- 20m直線がとれる場所: 体育館 / 公園 / 河川敷。コーンやペットボトルで両端の目印を置く\n- **必ず体育館シューズかランニングシューズで**（卓球シューズは前後の急停止でソールが持たない）\n\n#### 実施方式（新体力テストのルールに準拠）\n\n文部科学省「新体力テスト（20歳〜64歳対象）」の20mシャトルランに沿って実施する。電子音に合わせて20m間を往復し、速度は約1分ごとに上がる。**2回続けて音に間に合わなくなった時点で終了**、そこまでの往復回数が記録。\n\n- 音源は市販の測定用アプリ・動画（「20mシャトルラン 音源」で検索）を使用\n- 前後に **ウォームアップ5–10分**（軽いジョグ＋動的ストレッチ、特にふくらはぎ・アキレス腱・股関節）と**クールダウンのストレッチ**を必ず入れる\n- 消費カロリー目安: 30回前後で約60–80kcal（走行時間が約4分のため単体では少ない。目的は体力向上）\n\n#### 得点基準（新体力テスト 項目別得点表・男子 20〜64歳）\n\n年齢による補正はなく、20〜64歳が同じ表で採点される。\n\n| 得点 | 回数     | 得点 | 回数     |\n| ---- | -------- | ---- | -------- |\n| 10点 | 95回以上 | 5点  | 32〜42   |\n| 9点  | 81〜94   | 4点  | 24〜31   |\n| 8点  | 67〜80   | 3点  | 18〜23   |\n| 7点  | 54〜66   | 2点  | 12〜17   |\n| 6点  | 43〜53   | 1点  | 11回以下 |\n\n出典: 文部科学省 新体力テスト実施要項（20歳〜64歳対象）項目別得点表\n\n#### 記録の推移\n\n| 日付       | 回数 | 得点 | メモ                      |\n| ---------- | ---- | ---- | ------------------------- |\n| 2026-08-12 | 32回 | 5点  | 初回測定（1本目）         |\n| 2026-08-12 | 25回 | 4点  | 2本目（疲労下・参考記録） |\n\n※ 記録として採用するのは**その日の1本目**。2本目以降は疲労の影響を受けるため参考値として残す。\n\n**当面の目標**: 43回（6点）→ 54回（7点）。体重が減るほど有利になる種目なので、減量と並行して伸びやすい。\n\n#### 頻度の組み方（全力測定は毎週やらない）\n\n全力テストは心肺・脚への負担が大きいため、毎週の全力実施は避ける。\n\n| 週           | 内容                                                                                  |\n| ------------ | ------------------------------------------------------------------------------------- |\n| 月1回        | **全力測定**（記録更新狙い）。その日は他の運動を入れない                              |\n| それ以外の週 | **サブマックス**: 前回記録の7割程度（例: 32回なら22回）で止めるのを2本、間に休憩3–5分 |\n\nサブマックスの週は「限界まで行かない」ことが重要。回復を残しつつ、切り返しの動作パターンを体に覚えさせるのが狙い。\n\n#### 注意（46歳・体重77kg台での安全策）\n\n- **週1回まで**。切り返しの衝撃は膝・アキレス腱への負担が大きく、回復に48時間以上かかる\n- **火曜（卓球）の前日である月曜には入れない**。金曜が最適（卓球から中2日、次の卓球まで中3日）\n- ターンは**両足で減速してから**向きを変える。片足で急に捻ると膝を痛める\n- アキレス腱・膝に違和感が出たら即中止。翌週はエアロバイクに置き換える\n- 体重が減るほど関節への負担は下がる。焦って本数を増やさず、**まず「続く形」を作る**\n\n#### 記録の仕方（チャットで報告すればこちらで実行します）\n\n```sh\nnode --experimental-strip-types --disable-warning=ExperimentalWarning src/cli.ts log exercise --type シャトルラン --minutes 4 --note \"新体力テスト方式 32回（5点）\"\n```\n\n## 計測・記録ルール\n\n- **毎朝、起床後・排泄後・食前**に体重・体脂肪率を計測し、このチャットで報告する\n- 食事・運動・睡眠はその都度チャットで報告 → Claude がデータに記録しダッシュボードを更新\n- 見える化: `dashboard.html`（体重推移・目標線・カロリー・運動履歴）\n\n## 見直しルール\n\n- **2週間以上体重が停滞** → 摂取カロリーを100–200kcal下げるか、有酸素を1回追加\n- **週1kgを超えるペースで減少** → 筋肉低下のリスク。摂取を1,800–1,900kcalに戻す\n- **強い疲労・体調不良** → ペースダウン。無理をしない\n\n## 注意事項\n\n3ヶ月で7.4kgはやや速いペース。タンパク質の確保と筋トレで筋肉の低下を防ぐことが成功の鍵。体調に異常を感じた場合は計画を中止し、医師に相談すること。\n";
document.getElementById('content').innerHTML = marked.parse(MD);

// 見出しにGitHub風のアンカーidを付与する（日本語は保持、空白はハイフン、記号は除去）。
// menu.html からの recipes.html#料理名 のようなアンカーリンクを機能させるため。
(function () {
  const seen = new Set();
  document.querySelectorAll('.md h1,.md h2,.md h3,.md h4,.md h5,.md h6').forEach(function (h) {
    const base = h.textContent
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[!-/:-@[-\`{-~、。・（）［］「」『』：；？！　]/g, '');
    let id = base;
    let n = 1;
    while (document.getElementById(id) || seen.has(id)) {
      id = base + '-' + n;
      n += 1;
    }
    seen.add(id);
    h.id = id;
  });
})();
</script>

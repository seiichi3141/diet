<script>
const MD = "# 減量・体力増強計画書\n\n作成日: 2026-08-06\n\n## 基本情報\n\n| 項目        | 値                       |\n| ----------- | ------------------------ |\n| 年齢 / 性別 | 46歳 / 男性              |\n| 身長        | 178cm                    |\n| 体重        | 77.4kg                   |\n| 体脂肪率    | 24.6%                    |\n| BMI         | 24.4（標準上限ギリギリ） |\n| 現在の運動  | 週1回 卓球90分           |\n\n参考: 脂肪量 約19.0kg / 除脂肪体重 約58.4kg\n\n## 目標\n\n- **体重 70kg 以下（-7.4kg）**\n- 期間: **2026-08-06 → 2026-12-31（約21週）** ※ 2026-08-26 に 11/06 から延長（実測ペースに合わせた見直し）\n- 計画ペース: **約0.35kg/週**\n- 筋肉を維持しながら脂肪を落とし、体脂肪率 20% 前後を目安にする\n- 筋力・体力の増強（自重トレ・有酸素の習慣化）\n\n## カロリー設計（数値根拠）\n\n**2026-08-16 改定**（実測にもとづく見直し。経緯は「見直し履歴」を参照）\n\n| 項目                 | 値                | 算出                                                                             |\n| -------------------- | ----------------- | -------------------------------------------------------------------------------- |\n| 基礎代謝 BMR         | 約1,660 kcal      | Mifflin-St Jeor: 10×77.4 + 6.25×178 − 5×46 + 5                                   |\n| TDEE（当初の推定値） | 約2,330 kcal      | BMR × 活動係数1.4 — **実測と合わず、過大だった**                                 |\n| **TDEE（実測推定）** | **約1,950 kcal**  | 開始13日間の平均摂取1,841kcalで体重−0.2kgだったことから逆算（2026-08-19 再計算） |\n| **摂取目標**         | **1,450 kcal/日** | 実測TDEE − 約500 kcal                                                            |\n\n- 赤字: 約500 kcal/日 → 週 約3,500 kcal ≒ **脂肪 0.45kg/週**\n- 記録は自己申告の推定値のため誤差はあるが、**週 0.4–0.5kg 減**が現実的なレンジ\n\n### 目標達成の見通し（実測にもとづく試算・2026-08-26 更新）\n\n週平均体重 76.70kg（8/20–8/26）から 70kg まで **残り6.7kg**。\n\n実測ペース（週0.33kg）と、運動を積み増した場合（週0.45kg）で見た到達時期:\n\n| 前提                   | 週あたり減 | 70kg到達時期     |\n| ---------------------- | ---------- | ---------------- |\n| 現状の生活を継続       | 0.33kg     | 2027年1月中旬    |\n| **有酸素を少し増やす** | **0.37kg** | **2026年12月末** |\n| 有酸素を本格的に増やす | 0.45kg     | 2026年12月上旬   |\n\n**目標日を 2026-12-31（年内に70kg）に設定した。** 週0.37kgのペースで到達する計算で、実測の範囲内にある現実的な数字。\n\n無理に期限を守るために摂取をさらに削ると筋肉が落ちる（1,450kcalは既に基礎代謝1,660kcalを下回っている）。**続けられるペースを維持することを優先する。**\n\n## PFC 目標（1日あたり・1,450kcal 版）\n\n| 栄養素     | 目標         | kcal換算 |\n| ---------- | ------------ | -------- |\n| タンパク質 | **110–120g** | 約460    |\n| 脂質       | 約45g        | 約405    |\n| 炭水化物   | 約150g       | 約600    |\n\n- **カロリーを下げてもタンパク質は下げない。** 減らすのは主に炭水化物（ご飯の量）\n- **プロテイン（定期購入済み）を1日2杯**（P 40g / 220kcal）飲む前提。食事側は P 70–80g を目安に確保\n- タンパク質を削らないことが筋肉維持の条件\n\n### 1,450kcal で運用する際の注意\n\n摂取目標が**基礎代謝（約1,660kcal）を下回る**設定になっている。体脂肪率24%前後あるため短期的には問題ないが、以下を守ること。\n\n- **タンパク質110g以上と筋トレを必ず継続**する（これがないと筋肉から落ちる）\n- 次のいずれかが出たら**摂取を1,600kcalに戻す**: 強い倦怠感が1週間続く / 睡眠が浅くなる / 卓球やトレーニングのパフォーマンスが明らかに落ちる / 手足の冷え・立ちくらみ\n- **週1回は1,700kcal程度食べる日を作ってよい**（代謝の落ち込みと反動食いの予防）\n\n## 見直し履歴\n\n### 2026-08-26: 目標日を 2026-11-06 → 2026-12-31 に延長\n\n**判断の根拠**（水割り移行後の1週間の実測）\n\n| 項目               | 実績                                                   |\n| ------------------ | ------------------------------------------------------ |\n| 週平均体重         | 8/13–8/19: 77.03kg → 8/20–8/26: **76.70kg**（−0.33kg） |\n| 平均摂取           | 1,432 kcal/日（目標1,450を遵守）                       |\n| 平均タンパク質     | 126 g/日（目標達成）                                   |\n| 運動               | 直近7日 5回・380分（前週277分から+100分）              |\n| 体脂肪率（週平均） | 23.94% → 23.81% → **23.45%**（3週連続で低下）          |\n\n食事は7日連続で目標圏内、運動も積み増した週で **週0.33kg減**。11/6 に必要な週0.63kgには届かないことが実測で確定した。\n\n**摂取をさらに削る案（1,300kcal）は採らない。** 1,450kcalは既に基礎代謝（1,660kcal）を下回っており、これ以上下げると除脂肪量の維持（現在 +0.4kg）が崩れる。20日間で脂肪−1.2kg・除脂肪量+0.4kgという内容は成功しているので、**やり方は変えず期限だけを実測に合わせる**方針とした。\n\n### 2026-08-16: 摂取目標を 1,700 → 1,450 kcal に変更\n\n**判断の根拠**（開始11日間の実測）\n\n| 項目           | 実績                                               |\n| -------------- | -------------------------------------------------- |\n| 週平均体重     | 8/6–8/12: 76.94kg → 8/13–8/16: 77.00kg（**停滞**） |\n| 平均摂取       | 1,841 kcal/日（**目標1,700を超過**）               |\n| 平均タンパク質 | 129 g/日（目標達成）                               |\n| 体脂肪率       | 24.6% → 23.9%（−0.7pt）                            |\n| 運動           | 11日で7回・407分                                   |\n| 飲酒           | **11日中8日**・合計1,895kcal（1日平均172kcal）     |\n\n当初は「目標を守っていたのに減らない」と判断したが、**2026-08-19 にプロテインの牛乳分（1杯あたり171kcal）が全記録で欠落していたことが判明**し、実際の平均摂取は1,841kcalで目標を140kcal超過していた。停滞の原因は代謝ではなく単純な摂取超過。\n\n実測TDEEは約1,950kcal（当初推定2,330kcalよりは低い）。摂取1,450kcalなら赤字は約500kcal/日となり、週0.45kg減が見込める。体脂肪率は下がり続けているため、食事の質と運動の方向性は正しい。\n\n**記録の精度について**: この件で、記録漏れが分析全体を誤らせることが分かった。飲み物・調味料・調理油も含めて報告する。\n\n## 食事方針\n\n- 具体的な1週間メニューと買い物リストは **[menu.md](menu.html)** を参照（週1–2回の買い物で使い切る設計）\n- 間食・砂糖入り飲料は原則なし。アルコールは控えめ（週2回以内・1回1杯程度まで）\n- **1,450kcal ではアルコールの枠がほとんどない**。レモンサワー1杯で約120kcal、缶チューハイ500mlで約220kcal、ビール中1杯で約200kcal ＝ その日の8〜15%を占める。飲む日はご飯をさらに減らすか、飲まない日を増やして週平均で帳尻を合わせる\n- 夕食は就寝3時間前までに済ませる\n- 食べたものはその都度記録し、カロリー・PFCを推定する（menu.md にある料理はそこに記載の数値を使う）\n\n## 運動計画（自宅・屋外中心、ジム不要）\n\n| 種類                     | 頻度    | 内容                                                                                     |\n| ------------------------ | ------- | ---------------------------------------------------------------------------------------- |\n| 卓球                     | 週1回   | 90分（**火曜日**・現行継続）                                                             |\n| 自重トレ                 | 週2–3回 | スクワット / 腕立て / プランク / ランジ / 腹筋 各2–3セット（筋肉量維持が主目的）         |\n| 有酸素                   | 週2–3回 | 簡易エアロバイク 20–30分、または外でのランニング（最初は快走〜ゆっくりラン20分程度から） |\n| **20mシャトルラン**      | 週1回   | 卓球の体力作り用（金曜）。詳細は下記「20mシャトルラン」                                  |\n| （オプション）体育館ジム | 週1–2回 | 必要な場合のみ。自重トレの置き換え・負荷向上用                                           |\n\n週間スケジュール（卓球は火曜固定）:\n\n| 曜日 | 内容                                |\n| ---- | ----------------------------------- |\n| 月   | 自重トレ                            |\n| 火   | **卓球（90分）**                    |\n| 水   | 休み or 軽めのエアロバイク          |\n| 木   | 自重トレ                            |\n| 金   | **20mシャトルラン** or エアロバイク |\n| 土   | 自重トレ or ランニング（調整日）    |\n| 日   | 休み                                |\n\n### 自重トレの具体メニュー（週2–3回・1回20–30分）\n\n| #   | 種目       | 回数・時間 | セット | ポイント                                                     |\n| --- | ---------- | ---------- | ------ | ------------------------------------------------------------ |\n| 1   | スクワット | 10–15回    | 3      | 脚・お尻の大きな筋肉。膝はつま先と同じ方向、お尻を後ろに引く |\n| 2   | 腕立て伏せ | 8–12回     | 2–3    | 胸・腕。きつければ膝つきでOK                                 |\n| 3   | ランジ     | 左右各10回 | 2      | 脚・バランス。前足の膝が90度になるまで腰を落とす             |\n| 4   | プランク   | 30–60秒    | 2–3    | 体幹。頭からかかとまで一直線、腰を落とさない                 |\n| 5   | クランチ   | 15回       | 2      | 腹筋。腰を守るため肩甲骨が浮く程度まで起き上がる             |\n\n- セット間の休憩: 60–90秒\n- 開始前に軽いストレッチ5分（ウォームアップ）\n- 筋肉痛が残っていたら1日ずらす。無理に連続させない\n- **慣れてきたら**: 各種目の回数を+5ずつ増やす、または3秒かけてゆっくり下ろす（スロートレーニング化）で負荷を上げる\n- さらに余裕が出たら体育館ジム（オプション）でマシン・ダンベルに移行するのも有効\n\n### 有酸素の内容\n\n- **エアロバイク**: 20–30分。軽く息が弾むが会話はできる強度（心拍数の目安 120–130）\n- **ランニング**: いきなり走り続けず、「1分走る + 2分歩く」×5セット程度のウォーク＆ランから開始。膝・足首をいたわる\n- 2–3週間続けて余裕が出たら、走る時間を少しずつ延ばす\n\n### 20mシャトルラン（卓球の体力作り）\n\n20mを往復し、そのたびに減速・切り返し・再加速を繰り返す間欠的高強度運動。**ラリー中の動きと負荷特性が近く、卓球の粘り（後半のフットワーク維持）に直結する**。全身持久力（最大酸素摂取量）を上げる効果も高い。\n\n#### 場所・装備\n\n- 20m直線がとれる場所: 体育館 / 公園 / 河川敷。コーンやペットボトルで両端の目印を置く\n- **必ず体育館シューズかランニングシューズで**（卓球シューズは前後の急停止でソールが持たない）\n\n#### 実施方式（新体力テストのルールに準拠）\n\n文部科学省「新体力テスト（20歳〜64歳対象）」の20mシャトルランに沿って実施する。電子音に合わせて20m間を往復し、速度は約1分ごとに上がる。**2回続けて音に間に合わなくなった時点で終了**、そこまでの往復回数が記録。\n\n- 音源は市販の測定用アプリ・動画（「20mシャトルラン 音源」で検索）を使用\n- 前後に **ウォームアップ5–10分**（軽いジョグ＋動的ストレッチ、特にふくらはぎ・アキレス腱・股関節）と**クールダウンのストレッチ**を必ず入れる\n- 消費カロリー目安: 30回前後で約60–80kcal（走行時間が約4分のため単体では少ない。目的は体力向上）\n\n#### 得点基準（新体力テスト 項目別得点表・男子 20〜64歳）\n\n年齢による補正はなく、20〜64歳が同じ表で採点される。\n\n| 得点 | 回数     | 得点 | 回数     |\n| ---- | -------- | ---- | -------- |\n| 10点 | 95回以上 | 5点  | 32〜42   |\n| 9点  | 81〜94   | 4点  | 24〜31   |\n| 8点  | 67〜80   | 3点  | 18〜23   |\n| 7点  | 54〜66   | 2点  | 12〜17   |\n| 6点  | 43〜53   | 1点  | 11回以下 |\n\n出典: 文部科学省 新体力テスト実施要項（20歳〜64歳対象）項目別得点表\n\n#### 記録の推移\n\n| 日付       | 回数 | 得点 | メモ                      |\n| ---------- | ---- | ---- | ------------------------- |\n| 2026-08-12 | 32回 | 5点  | 初回測定（1本目）         |\n| 2026-08-12 | 25回 | 4点  | 2本目（疲労下・参考記録） |\n\n※ 記録として採用するのは**その日の1本目**。2本目以降は疲労の影響を受けるため参考値として残す。\n\n**当面の目標**: 43回（6点）→ 54回（7点）。体重が減るほど有利になる種目なので、減量と並行して伸びやすい。\n\n#### 頻度の組み方（全力測定は毎週やらない）\n\n全力テストは心肺・脚への負担が大きいため、毎週の全力実施は避ける。\n\n| 週           | 内容                                                                                  |\n| ------------ | ------------------------------------------------------------------------------------- |\n| 月1回        | **全力測定**（記録更新狙い）。その日は他の運動を入れない                              |\n| それ以外の週 | **サブマックス**: 前回記録の7割程度（例: 32回なら22回）で止めるのを2本、間に休憩3–5分 |\n\nサブマックスの週は「限界まで行かない」ことが重要。回復を残しつつ、切り返しの動作パターンを体に覚えさせるのが狙い。\n\n#### 注意（46歳・体重77kg台での安全策）\n\n- **週1回まで**。切り返しの衝撃は膝・アキレス腱への負担が大きく、回復に48時間以上かかる\n- **火曜（卓球）の前日である月曜には入れない**。金曜が最適（卓球から中2日、次の卓球まで中3日）\n- ターンは**両足で減速してから**向きを変える。片足で急に捻ると膝を痛める\n- アキレス腱・膝に違和感が出たら即中止。翌週はエアロバイクに置き換える\n- 体重が減るほど関節への負担は下がる。焦って本数を増やさず、**まず「続く形」を作る**\n\n## 計測のルール\n\n- **毎朝、起床後・排泄後・食前**に体重・体脂肪率を計測する。条件を揃えないと日々の比較ができない\n- 食事・運動・睡眠はその都度記録する。**飲み物・調味料・調理油も含める**\n- 判断に使うのは日々の数字ではなく**週平均**。1日の増減は水分による変動が大半を占める\n\n## 見直しルール\n\n- **2週間以上体重が停滞** → 摂取カロリーを100–200kcal下げるか、有酸素を1回追加\n- **週1kgを超えるペースで減少** → 筋肉低下のリスク。摂取を1,800–1,900kcalに戻す\n- **強い疲労・体調不良** → ペースダウン。無理をしない\n\n## 注意事項\n\n3ヶ月で7.4kgはやや速いペース。タンパク質の確保と筋トレで筋肉の低下を防ぐことが成功の鍵。体調に異常を感じた場合は計画を中止し、医師に相談すること。\n";

// 見出しにGitHub風のアンカーidを付与する（日本語は保持、空白はハイフン、記号は除去）。
// menu.html からの recipes.html#料理名 のようなアンカーリンクを機能させるため。
(function () {
  const seen = new Set();
  document.querySelectorAll('.md h1,.md h2,.md h3,.md h4,.md h5,.md h6').forEach(function (h) {
    const base = h.textContent
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[!-/:-@[-\`{-~、。・（）［］「」『』：；？！　]/g, '');
    let id = base;
    let n = 1;
    while (document.getElementById(id) || seen.has(id)) {
      id = base + '-' + n;
      n += 1;
    }
    seen.add(id);
    h.id = id;
  });
})();

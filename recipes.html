<script>
const MD = "# レシピ集\n\n[menu.md](menu.html) の各料理の作り方。分量はすべて1人分（特記なし）。\n調理時間はいずれも5–15分。味付けの油は1日小さじ1–2まで（plan.md 参照）。\n\n## 主菜\n\n### 鶏むねネギ塩レモン焼き\n\n材料: 鶏むね肉150g / 長ねぎ1/3本 / レモン汁 小さじ1 / 塩こしょう少々 / 油 小さじ1/2\n\n1. 鶏むねは5mm厚のそぎ切りにし、塩こしょうをもみ込む\n2. フライパンに油を熱し、中火で片面2–3分ずつ焼く\n3. 刻んだねぎ・レモン汁・塩ひとつまみを混ぜてかける\n\n### よだれ鶏\n\n材料: 鶏むね150g / 酒 大さじ1 / タレ（醤油・酢 各大さじ1、砂糖 小さじ1、ごま油・辣油 各小さじ1/2、すりごま 小さじ1、刻みねぎ）\n\n1. 耐熱皿に鶏むねと酒を入れ、ふんわりラップして600Wで2分。裏返して1分半、ラップしたまま5分置く\n2. タレの材料をすべて混ぜる\n3. 薄切りにした鶏にタレをかける\n\n### 鶏ハム\n\n好みに合わなかったため、2026-09-08 に週間メニューからは外した（選択肢として残す）。\n\n材料（作り置き）: 鶏むね1枚（約300g）/ 塩 小さじ1/2 / 砂糖 小さじ1/2 / こしょう少々\n\n1. 鶏むねに調味料をすり込み、保存袋の空気を抜いて一晩（最低1時間）冷蔵で寝かせる\n2. 袋ごと沸騰した湯に入れて火を止め、蓋をして20分放置\n3. 粗熱を取って薄切りに。冷蔵で3日保存可\n\n### 豆腐ステーキ\n\n材料: 木綿豆腐200g / 片栗粉 適量 / 油 小さじ1/2 / 醤油・みりん 各小さじ2\n\n1. 豆腐はキッチンペーパーに包み10分水切りする\n2. 片栗粉をまぶし、油を熱したフライパンで両面こんがり焼く\n3. 醤油・みりんを回し入れ、からめながら30秒煮る\n\n### サバ缶とキャベツの味噌煮\n\n材料: サバ水煮缶1/2缶 / キャベツ2枚 / 味噌 大さじ1 / みりん 大さじ1/2 / 水50ml\n\n1. 小鍋に水・味噌・みりんを溶かし、ざく切りのキャベツを中火で3分煮る\n2. サバを缶汁ごと加え、さらに2分煮る\n\n### ささみの梅しそ和え\n\n材料: ささみ150g / 梅干し1個 / 大葉3枚 / 酒 大さじ1\n\n1. ささみは筋を取り、酒をふりラップして600Wで1分半〜2分加熱\n2. 粗熱を取り、食べやすくほぐす\n3. 種を取って叩いた梅干しと千切りの大葉を和える\n\n### ささみの棒棒鶏\n\n材料: ささみ150g / ごまだれ（練りごま 大さじ1・醤油 小さじ2・酢 小さじ1・砂糖 小さじ1/2）/ 酒 大さじ1\n\n1. ささみは「梅しそ和え」と同じ手順でレンジ加熱してほぐす\n2. ごまだれの材料を混ぜ、ささみと和える\n\n### ささみと残り野菜の中華風炒め\n\n余った野菜をまとめて片づけられる一品。買い物前日の冷蔵庫整理に使える。ささみは片栗粉をまぶすとパサつかない。\n\n材料（1人分）: ささみ150g（3本程度）/ 残り野菜 合わせて150–200g（キャベツ・玉ねぎ・にんじん・きのこ・小松菜など何でも）/ 酒 小さじ1 / 塩こしょう 少々 / 片栗粉 小さじ2 / サラダ油 小さじ1 / 鶏がらスープの素 小さじ1/2 / 醤油 小さじ1 / 生姜チューブ 2cm（あれば）\n\n1. ささみは筋を取り、**そぎ切り**（包丁を斜めに寝かせて薄く）にする。酒と塩こしょうをふって軽くもみ、**片栗粉を薄くまぶす**\n2. 野菜は食べやすい大きさに切る。にんじん・玉ねぎなど火の通りにくいものと、葉物を分けておく\n3. フライパンに油を熱し、ささみを重ならないように並べて中火で焼く。両面に焼き色がついたら一度取り出す\n4. 同じフライパンで硬い野菜から炒め、しんなりしたら葉物とささみを戻す\n5. 鶏がらスープの素・醤油・生姜を加えて全体にからめ、こしょうで味を整える\n\n約245kcal / P37g（ささみ150g・野菜150g・油小さじ1の場合）\n\n- 片栗粉が肉汁を閉じ込めるので、ささみでもしっとり仕上がる\n- **味付けは最後にまとめて**。先に入れると野菜から水分が出て水っぽくなる\n- 葉物は最後の30秒で加えると食感が残る\n\n### 鶏むね照り焼き\n\n甘辛味が好みの場合の選択肢として残す（2026-09-03 に木曜夕食はカレー粉焼きへ差し替え）。\n\n材料: 鶏むね150g（下味冷凍分を前日冷蔵解凍）/ 醤油・みりん・酒 各大さじ1 / 砂糖 小さじ1\n\n1. 鶏むねを一口大に切り、フライパンで両面に焼き色をつける\n2. 調味料をすべて加え、とろみがつくまで中火で煮からめる\n\n### 鶏むねのカレー粉焼き\n\n照り焼きの甘辛味に飽きたとき用。**カレー粉はほぼ0kcalなのに味の方向が完全に変わる**ので、鶏むねのローテーションに一番効く。\n\n材料: 鶏むね150g / カレー粉 小さじ1 / 塩こしょう 少々 / 片栗粉 小さじ2 / 油 小さじ1/2\n\n1. 鶏むねをそぎ切りにし、塩こしょうとカレー粉をもみ込む\n2. **片栗粉を薄くまぶす**（これでパサつかない）\n3. 油を熱したフライパンで、中火で片面2分ずつ焼く\n\n約200kcal / P35g\n\n- カレー粉は焦げやすいので中火まで。強火にしない\n- クミンやガラムマサラがあれば少量足すとさらに変わる\n\n### 蒸し鶏のポン酢おろし\n\n**さっぱり食べたい日・暑い日向き。** レンジだけで完結し、油を使わないので今回の3つで最も低カロリー。\n\n材料: 鶏むね150g / 酒 大さじ1 / 塩少々 / 大根おろし 大さじ3 / ポン酢 小さじ2 / （あれば刻みねぎ・大葉）\n\n1. 耐熱皿に鶏むねと酒・塩を入れ、ふんわりラップして600Wで2分\n2. 裏返して1分半加熱し、**ラップしたまま5分置く**（余熱で火を通すとしっとりする）\n3. 薄切りにし、大根おろしをのせてポン酢をかける\n\n約185kcal / P35g\n\n- 加熱しすぎがパサつきの原因。余熱を使うのが最大のコツ\n- 大根がなければ、ポン酢と刻みねぎだけでも十分\n\n### 鶏むねの塩麹焼き\n\n**しっとり感は3つの中で断トツ。** 塩麹の酵素が肉をやわらかくする。前日に漬けておく手間はあるが、鶏むねのパサつきが苦手なら試す価値がある。\n\n材料: 鶏むね150g / 塩麹 小さじ2 / 油 小さじ1/2 / こしょう少々\n\n1. 鶏むねをそぎ切りにし、塩麹をもみ込んで**冷蔵で30分〜一晩**置く\n2. 塩麹を軽くぬぐい（焦げ防止）、油を熱したフライパンで弱めの中火で片面2〜3分ずつ焼く\n\n約200kcal / P35g\n\n- 塩麹は焦げやすいので弱めの中火で\n- 下味冷凍にも使える。保存袋で冷凍すれば解凍時に味が入る\n\n### 豚バラともやしの蒸し煮\n\nサムギョプサルで余った豚バラの使い切り用。**蒸すことで脂がしっかり落ちる**ので、焼くより脂質を抑えられる。フライパンひとつで7分。\n\n材料: 豚バラ薄切り100g / **下に敷く野菜**（もやし1/2袋、または玉ねぎ1/4個＋にんじん1/3本の薄切り、キャベツ・小松菜でも可）/ 酒 大さじ2 / ポン酢 適量 / （あれば刻みねぎ）\n\n1. フライパンにもやしと野菜を敷き、その上に豚バラを重ならないように広げる\n2. **酒を回しかけて蓋をし、弱めの中火で5–6分蒸す**\n3. 肉に火が通ったら、**出た脂をスプーンで取り除く**\n4. 器に盛ってポン酢をかける\n\n約290kcal / P16g（ご飯100gを添えて合計 約446kcal / P19g）\n\n- **豚バラは100g程度まで**。150gにすると脂質だけで40g近くになり、1日の目標（45g）をほぼ使い切ってしまう\n- 蒸したあとに脂を取り除くのが要。この一手間で30–40kcal変わる\n- 茹でて冷しゃぶにすると脂はさらに落ちるが、旨味も抜けやすい\n- **にんじん・玉ねぎは薄切りにして一番下に**。火が通りにくいので厚いと生煮えになる\n- **葉物（レタス・小松菜）は最後の1–2分で加える**。早く入れるとクタクタになる\n- ロメインレタスなら生のまま添えて、**サムギョプサルのように包んで食べる**のもおすすめ\n\n### 納豆オムレツ\n\n材料: 卵2個 / 納豆1パック / 油 小さじ1/2 / （あれば千切りキャベツ）\n\n1. 納豆に溶き卵を混ぜる（付属のタレも入れてよい）\n2. 油を熱したフライパンに流し、両面を焼いて半分に折る\n\n### サバ缶とキャベツの卵とじ\n\n土曜の昼用。**買い物前でも保存品（サバ缶・卵）と前週の残りキャベツだけで作れて、タンパク質が31g取れる**（従来の納豆オムレツより11g多い）。\n\n材料: サバ水煮缶1/2缶 / 卵2個 / キャベツ2枚 / 水50ml / めんつゆ（3倍濃縮）大さじ1 / （あれば刻みねぎ）\n\n1. 小鍋に水とめんつゆを入れ、ざく切りのキャベツを中火で2分煮る\n2. **缶汁を切った**サバを加えて1分煮る\n3. 溶き卵を回し入れ、**半熟のうちに火を止める**（余熱で固まる）\n\n約270kcal / P28g（ご飯100gを添えて合計 約426kcal / P31g）\n\n- 卵は混ぜすぎない。大きくかき混ぜて半熟で止めるとふんわりする\n- 缶汁を入れると水っぽく生臭くなるので必ず切る\n- ご飯にのせれば丼にもなる\n\n### ちゃんこ風鍋\n\n材料: 鶏むね150g（一口大）/ キャベツ1–2枚・玉ねぎ1/4個・きのこ1/2パック・豆腐1/2丁 / 水300ml / 鶏がらスープの素 小さじ1 / 醤油 小さじ2\n\n1. 鍋に水とスープの素を沸かし、鶏むね・キャベツ・玉ねぎ・きのこを中火で7–8分煮る\n2. 豆腐を加えて2分煮て、醤油で味を調える\n\n### 鶏むねとキャベツのタッカルビ風\n\n余ったキムチを**炒めて**使う一品。同じキムチでも[キムチ鍋](recipes.html#キムチ鍋ちゃんこ風鍋のアレンジ)（煮る）とは印象が変わるので、続けて食べても飽きにくい。\n\n材料: 鶏むね150g / キムチ80g / キャベツ2枚 / 玉ねぎ1/4個 / コチュジャン 小さじ1 / 醤油 小さじ1 / ごま油 小さじ1/2 / 片栗粉 小さじ2\n\n1. 鶏むねをそぎ切りにし、**片栗粉を薄くまぶす**（パサつき防止）\n2. ごま油を熱し、鶏むねを中火で両面焼いて一度取り出す\n3. 玉ねぎ・キャベツを炒め、しんなりしたらキムチを加えて1分炒める\n4. 鶏むねを戻し、コチュジャンと醤油をからめる\n\n約265kcal / P39g（ご飯150gを添えて合計 約499kcal / P42g）\n\n- **キムチは最後のほうに入れる**。長く炒めると酸味が飛びすぎる\n- コチュジャンがなければキムチの汁だけでも十分味がつく\n- チーズを入れると美味しいが+100kcal以上になるので、減量中は控える\n\n### キムチ鍋（ちゃんこ風鍋のアレンジ）\n\n[ちゃんこ風鍋](recipes.html#ちゃんこ風鍋)と**まったく同じ食材にキムチを足すだけ**。キムチは100gで30kcalしかないので、味が大きく変わる割にカロリーはほぼ増えない。余ったキムチの使い切りにも向く。\n\n材料: 鶏むね150g（一口大）/ キャベツ1–2枚・玉ねぎ1/4個・きのこ1/2パック・豆腐1/2丁 / **キムチ100g** / 水300ml / 鶏がらスープの素 小さじ1 / 味噌 小さじ1 / （あればコチュジャン 小さじ1/2）\n\n1. 鍋に水とスープの素を沸かし、**キムチを汁ごと入れて1分煮る**（先に煮ると辛味と旨味が出る）\n2. 鶏むね・キャベツ・玉ねぎ・きのこを加えて中火で7–8分煮る\n3. 豆腐を加えて2分煮て、味噌で味を調える\n\n約350kcal / P42g（ご飯100gを添えて合計 約506kcal / P45g）\n\n- **小松菜・ほうれん草などの青菜を足すと良い**（100gで14kcal）。茎を先に、葉は**最後の1–2分**で加えると食感が残る\n- **酸っぱくなったキムチほど鍋に向く**。発酵が進んだものは加熱すると旨味が出る\n- 〆のラーメン・雑炊は入れない。ここで300–400kcal乗る\n- キムチは開封後**冷蔵で1–2週間**が目安\n\n### サバ缶の味噌煮\n\n材料: サバ水煮缶1/2缶 / 味噌 大さじ1 / みりん・酒 各小さじ2 / 生姜（チューブ可）少々 / 水50ml\n\n1. 小鍋に水・味噌・みりん・酒・生姜を溶かして煮立てる\n2. サバを缶汁ごと入れ、中火で3分煮る\n\n### 家サムギョプサル（イベント用）\n\n外食より圧倒的にコントロールしやすい。**肉の量を計れる・〆がない・酒の量が自分次第**の3つが効く。\n\n材料（1人分）: 豚肩ロース薄切り150g / サンチュ 10–15枚 / エゴマの葉 5枚 / キムチ 50g / もやしナムル 適量 / サムジャン 大さじ1 / ごま油+塩 小さじ1/2 / にんにくスライス 少々\n\n1. ホットプレートか網で、**脂が落ちるように傾けて焼く**\n2. 焼いている途中で**キッチンペーパーで脂を拭き取る**\n3. サンチュ＋エゴマの葉に、肉・キムチ・にんにくを包んで食べる\n\n約620kcal / P25g（ご飯100g込み）\n\n- **豚バラより肩ロースを選ぶ**。150gで約90kcal低く、タンパク質は4g多い。サムギョプサル（三枚肉）本来はバラだが、家なら選べる\n- **葉は多めに用意する**（1人15–20枚）。包む手間がペースを落とし、満腹感も上がる\n- ご飯は葉で包むので基本不要。抜けば156kcal浮く\n- **〆の冷麺・ビビンバを作らない**ことが外食との最大の差\n\n### ケランチム（韓国式茶碗蒸し）\n\nサムギョプサルの定番副菜。**150kcalでタンパク質12g**取れるので、焼肉系の献立でタンパク質を底上げしたいときに効く。レンジで作れる。\n\n材料: 卵2個 / 水100ml / 鶏がらスープの素 小さじ1/2 / 塩 少々 / （あれば刻みねぎ・ごま油 数滴）\n\n1. 卵を溶き、水・鶏がらスープの素・塩を混ぜる（**茶こしでこすと格段になめらか**）\n2. 耐熱の器に入れ、ふんわりラップをして600Wで2分\n3. 中心がまだゆるければ**30秒ずつ追加**。加熱しすぎると\"す\"が入る\n4. 仕上げに刻みねぎとごま油を数滴\n\n約150kcal / P12g\n\n- 本来は土鍋でぐつぐつ煮る料理だが、レンジで十分再現できる\n- 加熱しすぎが失敗の原因。**余熱で固まる**ので早めに止める\n\n### 鮭の塩焼き\n\n材料: 生鮭1切れ / 塩 少々\n\n1. 鮭に軽く塩をふり5分置く\n2. 魚焼きグリル、またはフライパン（薄く油・蓋あり弱中火）で片面4–5分ずつ焼く\n\n### 鮭のホイル焼き\n\n材料: 生鮭1切れ / 玉ねぎ1/4個・きのこ1/2パック / 塩こしょう少々 / （あればバター5g または ポン酢）\n\n1. アルミホイルに鮭と野菜を乗せ、塩こしょうする\n2. 包んでフライパンに置き、水大さじ2を回りに入れて蓋をし、弱中火で10分蒸し焼きにする\n\n## 副菜\n\n### ほうれん草のおひたし\n\n材料: ほうれん草1袋 / 醤油 小さじ2 / （あれば鰹節）\n\n1. 沸騰した湯で1分茹で、冷水に取り水気を強めに絞る\n2. 4–5cmに切り、醤油をかける\n3. 作り置きする場合は小分けにして冷蔵2日（水曜夕食分までカバー）\n\n### ブロッコリーの塩ゆで\n\n材料: ブロッコリー適量 / 塩 少々\n\n1. 小房に分け、塩を入れた熱湯で2分茹でる。歯応えを残す\n\n### にんじんのきんぴら\n\n材料: にんじん1/2本 / 油 小さじ1/2 / 醤油・みりん 各小さじ1\n\n1. にんじんを千切りにし、油で中火2分炒める\n2. 醤油・みりんを絡めて1分炒める\n\n### 小松菜のおひたし\n\nほうれん草のおひたしと同じ手順。\n\n**大量に手に入ったときは茹でて冷凍**しておくと便利。4–5cmに切って水気を絞り、小分けにしてラップで包めば**冷凍で約3週間**。使うときは自然解凍か、鍋・味噌汁にそのまま入れられる。生のままだと冷蔵3–4日が限界。\n\n### 小松菜炒め\n\n材料: 小松菜1/2袋 / 油 小さじ1/2 / 塩こしょう・にんにく（チューブ可）少々\n\n1. ざく切りにし、油とにんにくで中火2分炒めて調味する\n\n### キャベツサラダ\n\n材料: キャベツ1–2枚 / 塩こしょう少々 / オリーブ油 小さじ1/2（または胡麻ドレッシング少々）\n\n1. 千切りにして水にさらし、よく水気を切って調味する\n\n### きのこのおひたし風\n\nほうれん草・小松菜が手に入らないときの、おひたしの代替。作り置き可（冷蔵3日）。\n\n材料: しめじ・えのきなど 1/2パック / めんつゆ（3倍濃縮）小さじ2 / 水 大さじ1 / 鰹節 少々\n\n1. きのこを小房に分け、耐熱容器に入れてラップをし600Wで2分加熱する\n2. 出た水分を軽く切り、めんつゆと水を混ぜて和える\n3. 冷めたら鰹節をふる\n\n約25kcal / P2g\n\n### キャベツのごま和え\n\nこちらもおひたしの代替。キャベツが余っているときに。\n\n材料: キャベツ2枚（100g程度）/ すりごま 小さじ2 / 醤油 小さじ1 / 砂糖 ひとつまみ / ごま油 数滴\n\n1. キャベツをざく切りにし、耐熱容器で600W 2分加熱（または熱湯で1分ゆでる）\n2. 水気をしっかり絞り、調味料と和える\n\n約60kcal / P2g\n\n### サバ缶とほうれん草の炒め\n\n冷凍ほうれん草と、半分だけ残ったサバ水煮缶を同時に片づけられる一品。**副菜なのにタンパク質が17g取れる**ので、筋トレをした日の底上げに向く。\n\n材料: サバ水煮缶1/2缶 / 冷凍ほうれん草100g / にんにく（チューブ可）2cm / 醤油 小さじ1 / ごま油 小さじ1/2 / こしょう少々\n\n1. 冷凍ほうれん草をレンジで解凍し、**水気をしっかり絞る**（絞らないと水っぽくなる）\n2. フライパンにごま油とにんにくを熱し、ほうれん草を中火で1分炒める\n3. **缶汁を切った**サバを加え、大きめにほぐしながら1分炒める\n4. 醤油とこしょうで味を整える\n\n約140kcal / P17g\n\n- サバは崩しすぎない。大きめの塊を残したほうが食べ応えが出る\n- 缶汁を入れると水っぽく生臭くなるので必ず切る\n- 小松菜・チンゲン菜でも同じ手順で作れる\n\n### 残り野菜のコンソメスープ\n\n材料: 余った野菜・きのこ 適量 / 水200ml / コンソメ 小さじ1\n\n1. すべて鍋に入れて中火5分煮るだけ\n\n### 味噌汁\n\n材料: 水150ml / 味噌 大さじ1弱 / 豆腐（1/6丁程度）・乾燥わかめ 適量\n\n1. 水に豆腐・わかめを入れて煮る\n2. 火を止めてから味噌を溶く（煮立てると風味が落ちる）\n\n## 朝食パターンの作り方\n\n### オートミールの基本\n\n朝Aで使う戻し方。\n\n1. オートミール30gに水60mlを注ぎ、600Wで1分チンしてぬるま粥状にする\n2. 苦手な場合の対策: 水→牛乳にする / バナナときな粉（またははちみつ少量）を混ぜる / だしで煮て雑炊風にする（下記「オートミール雑炊」）\n\n### オートミール雑炊\n\n材料: オートミール40g / 卵1個 / 余り野菜 / 水150ml / 鶏がらスープの素 小さじ1/2\n\n1. 水とスープの素を沸かし、オートミールと刻んだ野菜を2–3分煮る\n2. 溶き卵を回し入れたら火を止める\n\n### ギリシャヨーグルトの食べ方\n\n**2026-08-26 以降はオイコス（フレーバー付き110g・92kcal / P10g / 脂肪0）を使用**。朝A・朝Cで1個ずつ。味がついているので、下記のトッピングは不要（無糖タイプを使う場合の参考として残す）。\n\n1. **バナナ＋きな粉**（定番）: バナナ1/2本を切ってのせ、きな粉 小さじ1をふる（+約55kcal）\n2. **はちみつ**: 小さじ1をかけるだけ（+約20kcal）。甘さはこれくらいに抑える\n3. **ごまはちみつ**: すりごま 小さじ1 + はちみつ 小さじ1（+約50kcal）。香ばしくて満足感あり\n4. **そのまま**: 無糖のまま。慣れるとこれが一番手軽\n\n※ きな粉・はちみつは任意ストック（なければ「そのまま」かバナナのみでOK）\n\n### ゆで卵（簡単な作り方）\n\n水から茹でる方法が失敗しにくくて簡単。\n\n1. 鍋に卵と、卵がかぶるくらいの**水**を入れて強火にかける（水からなら殻が割れにくい）\n2. 沸騰したら弱〜中火に落とす — **半熟: 6分 / 固茹で: 9〜10分**\n3. 茹で上がったらすぐ冷水にとる（黄身の黒ずみ防止＆殻がむきやすくなる）\n4. 殻は冷えてから、流水をあてながらむくとツルッとむける\n\n- まとめ作り: 土曜に5個。**殻つきのまま冷蔵で3日以内**に食べる\n- 白身が漏れたとき用: 湯に塩ひとつまみ（または酢少々）を入れておくと漏れてもすぐ固まる\n\n### 朝B（和定食）・朝C（軽めセット）\n\n- 朝B: ご飯を炊き、味噌汁（上記）・納豆・卵を並べるだけ\n- 朝C: ギリシャヨーグルト（上記「ギリシャヨーグルトの食べ方」）・バナナ・ゆで卵（作り置き）を盛るだけ\n\n## 作り置き・下味冷凍\n\n### 鶏むねの下味冷凍\n\n1. 購入日に150gずつ4等分に切り分ける\n2. 2つ（木・火用）に下味をもみ込む — **カレー粉焼き用: 塩こしょう＋カレー粉 小さじ1** / 鍋用: 塩こしょうのみ\n   - 甘辛味が好みなら照り焼き用（醤油・みりん各大さじ1/2）も可。塩麹 小さじ2 で漬けるとさらにしっとりする\n3. 保存袋に平らに入れて冷凍。使う前日に冷蔵庫へ移して解凍\n\n### 週初のまとめ作り（30分）\n\n1. ゆで卵5個 → 朝食・間食用\n2. ほうれん草のおひたし → 月・火・水の夕食用\n";
document.getElementById('content').innerHTML = marked.parse(MD);

// 見出しにGitHub風のアンカーidを付与する（日本語は保持、空白はハイフン、記号は除去）。
// menu.html からの recipes.html#料理名 のようなアンカーリンクを機能させるため。
(function () {
  const seen = new Set();
  document.querySelectorAll('.md h1,.md h2,.md h3,.md h4,.md h5,.md h6').forEach(function (h) {
    const base = h.textContent
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[!-/:-@[-\`{-~、。・（）［］「」『』：；？！　]/g, '');
    let id = base;
    let n = 1;
    while (document.getElementById(id) || seen.has(id)) {
      id = base + '-' + n;
      n += 1;
    }
    seen.add(id);
    h.id = id;
  });
})();

// 横に長い表はスマホで独立してスクロールさせる
document.querySelectorAll('.md table').forEach(function (t) {
  const box = document.createElement('div');
  box.className = 'table-scroll';
  box.tabIndex = 0;
  box.setAttribute('role', 'region');
  box.setAttribute('aria-label', '表（横にスクロールできます）');
  t.parentNode.insertBefore(box, t);
  box.appendChild(t);
});

// 既存の見出しIDを利用し、献立からのリンク先を保ったまま目次を作る。
const tocPanel = document.querySelector('.toc-panel');
function isCompact() { return window.matchMedia && window.matchMedia('(max-width: 760px)').matches; }
if (isCompact()) tocPanel.removeAttribute('open');
const headings = Array.from(document.querySelectorAll('.md h2,.md h3'));
const toc = document.getElementById('page-toc');
const status = document.getElementById('toc-status');
const items = headings.map(function (heading) {
  const li = document.createElement('li');
  if (heading.tagName === 'H3') li.className = 'toc-sub';
  const a = document.createElement('a');
  a.href = '#' + encodeURIComponent(heading.id);
  a.textContent = heading.textContent;
  a.addEventListener('click', function () {
    if (isCompact()) tocPanel.removeAttribute('open');
  });
  li.appendChild(a);
  toc.appendChild(li);
  return { li: li, link: a, heading: heading };
});
function normalizeSearch(value) { return value.normalize('NFKC').toLowerCase().trim(); }
document.getElementById('toc-search').addEventListener('input', function (event) {
  const query = normalizeSearch(event.target.value);
  let count = 0;
  items.forEach(function (item) {
    item.li.hidden = !normalizeSearch(item.heading.textContent).includes(query);
    if (!item.li.hidden) count += 1;
  });
  status.textContent = query ? (count ? count + '件の見出し' : '該当する見出しがありません') : '';
});
function markCurrent(id) {
  items.forEach(function (item) {
    if (item.heading.id === id) item.link.setAttribute('aria-current', 'location');
    else item.link.removeAttribute('aria-current');
  });
}
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(function (entries) {
    const visible = entries.filter(function (entry) { return entry.isIntersecting; });
    if (visible.length) markCurrent(visible[0].target.id);
  }, { rootMargin: '0px 0px -65% 0px' });
  headings.forEach(function (heading) { observer.observe(heading); });
}
function followHash() {
  let id;
  try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
  const target = document.getElementById(id);
  if (target) { target.scrollIntoView(); markCurrent(id); }
}
window.addEventListener('hashchange', followHash);
if (location.hash) requestAnimationFrame(followHash);
</script>

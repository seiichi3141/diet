<script>
const MD = "# レシピ集\n\n[menu.md](menu.html) の各料理の作り方。分量はすべて1人分（特記なし）。\n調理時間はいずれも5–15分。味付けの油は1日小さじ1–2まで（plan.md 参照）。\n\n## 主菜\n\n### 鶏むねネギ塩レモン焼き\n\n材料: 鶏むね肉150g / 長ねぎ1/3本 / レモン汁 小さじ1 / 塩こしょう少々 / 油 小さじ1/2\n\n1. 鶏むねは5mm厚のそぎ切りにし、塩こしょうをもみ込む\n2. フライパンに油を熱し、中火で片面2–3分ずつ焼く\n3. 刻んだねぎ・レモン汁・塩ひとつまみを混ぜてかける\n\n### よだれ鶏\n\n材料: 鶏むね150g / 酒 大さじ1 / タレ（醤油・酢 各大さじ1、砂糖 小さじ1、ごま油・辣油 各小さじ1/2、すりごま 小さじ1、刻みねぎ）\n\n1. 耐熱皿に鶏むねと酒を入れ、ふんわりラップして600Wで2分。裏返して1分半、ラップしたまま5分置く\n2. タレの材料をすべて混ぜる\n3. 薄切りにした鶏にタレをかける\n\n### 鶏ハム\n\n材料（作り置き・週に1回）: 鶏むね1枚（約300g）/ 塩 小さじ1/2 / 砂糖 小さじ1/2 / こしょう少々\n\n1. 鶏むねに調味料をすり込み、保存袋の空気を抜いて一晩（最低1時間）冷蔵で寝かせる\n2. 袋ごと沸騰した湯に入れて火を止め、蓋をして20分放置\n3. 粗熱を取って薄切りに。冷蔵で3日保存可\n\n### 豆腐ステーキ\n\n材料: 木綿豆腐200g / 片栗粉 適量 / 油 小さじ1/2 / 醤油・みりん 各小さじ2\n\n1. 豆腐はキッチンペーパーに包み10分水切りする\n2. 片栗粉をまぶし、油を熱したフライパンで両面こんがり焼く\n3. 醤油・みりんを回し入れ、からめながら30秒煮る\n\n### サバ缶とキャベツの味噌煮\n\n材料: サバ水煮缶1/2缶 / キャベツ2枚 / 味噌 大さじ1 / みりん 大さじ1/2 / 水50ml\n\n1. 小鍋に水・味噌・みりんを溶かし、ざく切りのキャベツを中火で3分煮る\n2. サバを缶汁ごと加え、さらに2分煮る\n\n### ささみの梅しそ和え\n\n材料: ささみ150g / 梅干し1個 / 大葉3枚 / 酒 大さじ1\n\n1. ささみは筋を取り、酒をふりラップして600Wで1分半〜2分加熱\n2. 粗熱を取り、食べやすくほぐす\n3. 種を取って叩いた梅干しと千切りの大葉を和える\n\n### ささみの棒棒鶏\n\n材料: ささみ150g / ごまだれ（練りごま 大さじ1・醤油 小さじ2・酢 小さじ1・砂糖 小さじ1/2）/ 酒 大さじ1\n\n1. ささみは「梅しそ和え」と同じ手順でレンジ加熱してほぐす\n2. ごまだれの材料を混ぜ、ささみと和える\n\n### 鶏むね照り焼き\n\n材料: 鶏むね150g（下味冷凍分を前日冷蔵解凍）/ 醤油・みりん・酒 各大さじ1 / 砂糖 小さじ1\n\n1. 鶏むねを一口大に切り、フライパンで両面に焼き色をつける\n2. 調味料をすべて加え、とろみがつくまで中火で煮からめる\n\n### 納豆オムレツ\n\n材料: 卵2個 / 納豆1パック / 油 小さじ1/2 / （あれば千切りキャベツ）\n\n1. 納豆に溶き卵を混ぜる（付属のタレも入れてよい）\n2. 油を熱したフライパンに流し、両面を焼いて半分に折る\n\n### ちゃんこ風鍋\n\n材料: 鶏むね150g（一口大）/ キャベツ1–2枚・玉ねぎ1/4個・きのこ1/2パック・豆腐1/2丁 / 水300ml / 鶏がらスープの素 小さじ1 / 醤油 小さじ2\n\n1. 鍋に水とスープの素を沸かし、鶏むね・キャベツ・玉ねぎ・きのこを中火で7–8分煮る\n2. 豆腐を加えて2分煮て、醤油で味を調える\n\n### サバ缶の味噌煮\n\n材料: サバ水煮缶1/2缶 / 味噌 大さじ1 / みりん・酒 各小さじ2 / 生姜（チューブ可）少々 / 水50ml\n\n1. 小鍋に水・味噌・みりん・酒・生姜を溶かして煮立てる\n2. サバを缶汁ごと入れ、中火で3分煮る\n\n### 鮭の塩焼き\n\n材料: 生鮭1切れ / 塩 少々\n\n1. 鮭に軽く塩をふり5分置く\n2. 魚焼きグリル、またはフライパン（薄く油・蓋あり弱中火）で片面4–5分ずつ焼く\n\n### 鮭のホイル焼き\n\n材料: 生鮭1切れ / 玉ねぎ1/4個・きのこ1/2パック / 塩こしょう少々 / （あればバター5g または ポン酢）\n\n1. アルミホイルに鮭と野菜を乗せ、塩こしょうする\n2. 包んでフライパンに置き、水大さじ2を回りに入れて蓋をし、弱中火で10分蒸し焼きにする\n\n## 副菜\n\n### ほうれん草のおひたし\n\n材料: ほうれん草1袋 / 醤油 小さじ2 / （あれば鰹節）\n\n1. 沸騰した湯で1分茹で、冷水に取り水気を強めに絞る\n2. 4–5cmに切り、醤油をかける\n3. 作り置きする場合は小分けにして冷蔵2日（水曜夕食分までカバー）\n\n### ブロッコリーの塩ゆで\n\n材料: ブロッコリー適量 / 塩 少々\n\n1. 小房に分け、塩を入れた熱湯で2分茹でる。歯応えを残す\n\n### にんじんのきんぴら\n\n材料: にんじん1/2本 / 油 小さじ1/2 / 醤油・みりん 各小さじ1\n\n1. にんじんを千切りにし、油で中火2分炒める\n2. 醤油・みりんを絡めて1分炒める\n\n### 小松菜のおひたし\n\nほうれん草のおひたしと同じ手順。\n\n### 小松菜炒め\n\n材料: 小松菜1/2袋 / 油 小さじ1/2 / 塩こしょう・にんにく（チューブ可）少々\n\n1. ざく切りにし、油とにんにくで中火2分炒めて調味する\n\n### キャベツサラダ\n\n材料: キャベツ1–2枚 / 塩こしょう少々 / オリーブ油 小さじ1/2（または胡麻ドレッシング少々）\n\n1. 千切りにして水にさらし、よく水気を切って調味する\n\n### 残り野菜のコンソメスープ\n\n材料: 余った野菜・きのこ 適量 / 水200ml / コンソメ 小さじ1\n\n1. すべて鍋に入れて中火5分煮るだけ\n\n### 味噌汁\n\n材料: 水150ml / 味噌 大さじ1弱 / 豆腐（1/6丁程度）・乾燥わかめ 適量\n\n1. 水に豆腐・わかめを入れて煮る\n2. 火を止めてから味噌を溶く（煮立てると風味が落ちる）\n\n## 朝食パターンの作り方\n\n### オートミールの基本\n\n朝Aで使う戻し方。\n\n1. オートミール30gに水60mlを注ぎ、600Wで1分チンしてぬるま粥状にする\n2. 苦手な場合の対策: 水→牛乳にする / バナナときな粉（またははちみつ少量）を混ぜる / だしで煮て雑炊風にする（下記「オートミール雑炊」）\n\n### オートミール雑炊\n\n材料: オートミール40g / 卵1個 / 余り野菜 / 水150ml / 鶏がらスープの素 小さじ1/2\n\n1. 水とスープの素を沸かし、オートミールと刻んだ野菜を2–3分煮る\n2. 溶き卵を回し入れたら火を止める\n\n### ギリシャヨーグルトの食べ方\n\n基本は **無糖100g（約60kcal / P10g）**。朝A・朝Cで使用するほか、デザート代わりの間食にも使える（間食の場合はその日のカロリーに計上する）。\n\n1. **バナナ＋きな粉**（定番）: バナナ1/2本を切ってのせ、きな粉 小さじ1をふる（+約55kcal）\n2. **はちみつ**: 小さじ1をかけるだけ（+約20kcal）。甘さはこれくらいに抑える\n3. **ごまはちみつ**: すりごま 小さじ1 + はちみつ 小さじ1（+約50kcal）。香ばしくて満足感あり\n4. **そのまま**: 無糖のまま。慣れるとこれが一番手軽\n\n※ きな粉・はちみつは任意ストック（なければ「そのまま」かバナナのみでOK）\n\n### ゆで卵（簡単な作り方）\n\n水から茹でる方法が失敗しにくくて簡単。\n\n1. 鍋に卵と、卵がかぶるくらいの**水**を入れて強火にかける（水からなら殻が割れにくい）\n2. 沸騰したら弱〜中火に落とす — **半熟: 6分 / 固茹で: 9〜10分**\n3. 茹で上がったらすぐ冷水にとる（黄身の黒ずみ防止＆殻がむきやすくなる）\n4. 殻は冷えてから、流水をあてながらむくとツルッとむける\n\n- まとめ作り: 土曜に5個。**殻つきのまま冷蔵で3日以内**に食べる\n- 白身が漏れたとき用: 湯に塩ひとつまみ（または酢少々）を入れておくと漏れてもすぐ固まる\n\n### 朝B（和定食）・朝C（軽めセット）\n\n- 朝B: ご飯を炊き、味噌汁（上記）・納豆・卵を並べるだけ\n- 朝C: ギリシャヨーグルト（上記「ギリシャヨーグルトの食べ方」）・バナナ・ゆで卵（作り置き）を盛るだけ\n\n## 作り置き・下味冷凍\n\n### 鶏むねの下味冷凍\n\n1. 購入日に150gずつ4等分に切り分ける\n2. 2つ（金・土用）に下味をもみ込む — 照り焼き用: 醤油・みりん各大さじ1/2 / 鍋用: 塩こしょうのみ\n3. 保存袋に平らに入れて冷凍。使う前日に冷蔵庫へ移して解凍\n\n### 週初のまとめ作り（30分）\n\n1. ゆで卵5個 → 朝食・間食用\n2. 鶏ハム1枚分 → 水曜昼用\n3. ほうれん草のおひたし → 月・火・水の夕食用\n";
document.getElementById('content').innerHTML = marked.parse(MD);

// 見出しにGitHub風のアンカーidを付与する（日本語は保持、空白はハイフン、記号は除去）。
// menu.html からの recipes.html#料理名 のようなアンカーリンクを機能させるため。
(function () {
  const seen = new Set();
  document.querySelectorAll('.md h1,.md h2,.md h3,.md h4,.md h5,.md h6').forEach(function (h) {
    const base = h.textContent
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[!-/:-@[-\`{-~、。・（）［］「」『』：；？！　]/g, '');
    let id = base;
    let n = 1;
    while (document.getElementById(id) || seen.has(id)) {
      id = base + '-' + n;
      n += 1;
    }
    seen.add(id);
    h.id = id;
  });
})();
</script>
